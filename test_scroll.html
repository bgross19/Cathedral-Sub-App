<!DOCTYPE html>
<html>
<head>
    <style>
        .container {
            width: 300px;
            overflow-x: auto;
            border: 1px solid black;
        }
        table {
            border-collapse: collapse;
            width: 600px; /* Force table to be wider than container */
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <table>
            <tr>
                <th>Column 1</th>
                <th>Column 2</th>
                <th>Column 3</th>
                <th>Column 4</th>
            </tr>
            <tr>
                <td>Data 1</td>
                <td>Data 2</td>
                <td>Data 3</td>
                <td>Data 4</td>
            </tr>
        </table>
    </div>
</body>
</html>
