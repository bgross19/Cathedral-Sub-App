name: Weekly Code Health Checkup

on:
  schedule:
    - cron: '0 0 * * 0' # Run at midnight on Sunday
  workflow_dispatch: # Allow manual trigger

jobs:
  lint:
    name: Code Health / Linting
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install eslint@8.57.1 eslint-plugin-html eslint-plugin-googleappsscript --save-dev

    - name: Initialize ESLint Configuration
      run: |
        cat << 'ESLINT_CONF' > .eslintrc.json
        {
            "env": {
                "browser": true,
                "es2021": true,
                "node": true,
                "googleappsscript/googleappsscript": true
            },
            "extends": "eslint:recommended",
            "plugins": [
                "html",
                "googleappsscript"
            ],
            "parserOptions": {
                "ecmaVersion": 12
            },
            "globals": {
                "google": "readonly",
                "flatpickr": "readonly",
                "escapeHtml": "readonly",
                "escapeJs": "readonly",
                "showToast": "readonly",
                "showConfirm": "readonly",
                "showDuplicateWarning": "readonly",
                "cancelDuplicateWarning": "readonly",
                "toggleModal": "readonly",
                "closeAllModals": "readonly",
                "attemptCloseAllModals": "readonly",
                "captureModalState": "readonly",
                "editAbsence": "readonly",
                "reloadApp": "readonly",
                "finishInitApp": "readonly",
                "loadSettingsData": "readonly",
                "loadStaffRosterSettings": "readonly",
                "loadPayPeriodsSettings": "readonly",
                "loadQuickCover": "readonly",
                "switchSettingsTab": "readonly",
                "getActiveTeacherSchedule": "readonly",
                "currentAppVersion": "writable",
                "isFromModal": "writable",
                "originalModalData": "writable",
                "staffList": "writable",
                "userTeacherSchedule": "writable",
                "userDateColors": "writable"
            },
            "rules": {
                "no-unused-vars": ["warn", { "vars": "all", "args": "none", "ignoreRestSiblings": false, "varsIgnorePattern": "^(Utilities_formatDateLocal|addAbsenceReasonRow|applyPayPeriodSelection|archiveOldDataClient|assignSubFromAtAGlance|cancelAbsence|cancelDuplicateWarning|cancelMySubDutyClient|changeAvailabilityMonth|clearAllDutiesClient|clearMasterScheduleCacheClient|closeMobileMenu|closePrincipalsDigestModal|copyAtAGlance|copyHRData|copyPrincipalsDigest|copyStaffRosterData|deleteAbsenceFromModal|deleteAllPayPeriodsClient|deleteStaffMember|exportAllAbsenceRequestsClient|exportToCSV|generateAuditReport|handleAdminAssign|handleApprovePayPeriod|handleAssign|handleCustomLogin|handleDutyCheckboxChange|handleHRDateChange|handleInlineAdminAssign|handleLogout|handleOnBehalfTeacherChange|initApp|loadStaffList|openAddStaffModal|openAdminEditModal|openDetailsModal|openDetailsModalForAdmin|openEditStaffModal|openSubDutyDetailsModal|previewPrincipalsDigest|processPayPeriodsCsvUpload|processStaffCsvUpload|refreshMasterScheduleCacheClient|removeAbsenceReasonRow|resetAdminFilters|saveDayPayRates|saveRolePermissions|saveSettings|saveStaffMember|setAdminView|setHRView|shiftAtAGlanceDate|showConfirm|showDuplicateWarning|sortAdminTable|submitSubFeedback|toggleAdminDashboard|toggleAtAGlanceDashboard|toggleAvailability|toggleDutyDropdown|toggleMobileMenu|toggleSettingsDashboard|updateDynamicStaffList|updateHiddenDutyInput|updateStaffRoleInline|dateStr|idx|index|instance|editAbsence|showToast|showConfirm|qCElement|isRequestModalOpen|quickCoverLink|todaysAbsencesData|oldAttemptCloseAllModals)$" }],
                "no-undef": "warn",
                "no-implicit-globals": "warn"
            },
            "settings": {
                "html/html-extensions": [".html"]
            }
        }
        ESLINT_CONF

    - name: Run ESLint
      run: npx eslint Index.html code.gs powerschool.gs tests.gs
