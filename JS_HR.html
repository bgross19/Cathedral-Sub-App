<!-- ====================================================================== -->
<!-- JS_HR.HTML — HR Dashboard, Pay Period Approval & Payroll Exports       -->
<!-- ====================================================================== -->
<script>
      function toggleHRDashboard() {
        const mainContent = document.getElementById('mainContent');
        const adminView = document.getElementById('adminDashboardView');
        const hrView = document.getElementById('hrDashboardView');
        const atAGlanceView = document.getElementById('atAGlanceDashboardView');
        const settingsView = document.getElementById('settingsDashboardView');

        if (hrView.classList.contains('hidden')) {
          mainContent.classList.add('hidden');
          if (adminView) adminView.classList.add('hidden');
          if (atAGlanceView) atAGlanceView.classList.add('hidden');
          if (settingsView) settingsView.classList.add('hidden');
          hrView.classList.remove('hidden');

          if (!hrDashboardLoaded) {
            loadHRDashboardData();
          }
        } else {
          hrView.classList.add('hidden');
          mainContent.classList.remove('hidden');
        }
      }

      function setHRView(viewType) {
        hrCurrentView = viewType;
        const btnAbsences = document.getElementById('hrToggleAbsences');
        const btnSubs = document.getElementById('hrToggleSubs');
        const filterUnpaidContainer = document.getElementById('hrFilterUnpaidContainer');

        if (viewType === 'absences') {
          btnAbsences.className = "flex-1 py-2 px-4 rounded-lg border-2 border-[#00843D] bg-[#00843D] text-white font-bold transition-colors";
          btnSubs.className = "flex-1 py-2 px-4 rounded-lg border-2 border-gray-200 text-gray-500 font-bold transition-colors";
          if (filterUnpaidContainer) filterUnpaidContainer.classList.add('hidden');
        } else {
          btnSubs.className = "flex-1 py-2 px-4 rounded-lg border-2 border-[#00843D] bg-[#00843D] text-white font-bold transition-colors";
          btnAbsences.className = "flex-1 py-2 px-4 rounded-lg border-2 border-gray-200 text-gray-500 font-bold transition-colors";
          if (filterUnpaidContainer) {
              filterUnpaidContainer.classList.remove('hidden');
              filterUnpaidContainer.classList.add('flex');
          }
        }

        applyHRFilters();
      }

      function renderHRDashboardData(data) {
            hrDashboardLoaded = true;
            hrDataRaw = data.requests || [];
            hrPayPeriods = data.payPeriods || [];
            hrDateColors = data.dateColors || {};
            hrRates = data.rates || { green: 10, blueGold: 20, special: "[]" };

            const today = new Date();
            const offset = today.getTimezoneOffset() * 60000;
            const endLocalDate = new Date(today - offset);
            const todayStr = endLocalDate.toISOString().split('T')[0];

            if (hrPayPeriods && hrPayPeriods.length > 0) {
              const ppContainer = document.getElementById('hrPayPeriodContainer');
              const ppSelect = document.getElementById('hrPayPeriodSelect');
              ppContainer.classList.remove('hidden');

              let html = `<option value="custom">Custom Range</option>`;
              let selectedIdx = -1;

              // Find the most recently completed pay period
              // "Completed" means today's date is strictly AFTER the pay period's end date
              let mostRecentCompletedIndex = -1;
              let mostRecentEndDate = "";

              for (let i = 0; i < hrPayPeriods.length; i++) {
                 const pp = hrPayPeriods[i];
                 if (todayStr > pp.endDate) {
                    if (mostRecentEndDate === "" || pp.endDate > mostRecentEndDate) {
                       mostRecentEndDate = pp.endDate;
                       mostRecentCompletedIndex = i;
                    }
                 }
              }

              hrPayPeriods.forEach((pp, idx) => {
                 let [sYear, sMonth, sDay] = pp.startDate.split('-');
                 let [eYear, eMonth, eDay] = pp.endDate.split('-');
                 const displayStart = `${sMonth}/${sDay}/${sYear}`;
                 const displayEnd = `${eMonth}/${eDay}/${eYear}`;
                 const isSelected = (idx === mostRecentCompletedIndex) ? "selected" : "";
                 if (isSelected) selectedIdx = idx;

                 const approvalCheck = pp.approved ? " ✅" : "";

                 html += `<option value="${idx}" ${isSelected}>Pay Period ${escapeHtml(pp.periodNumber)} (${escapeHtml(displayStart)} - ${escapeHtml(displayEnd)})${approvalCheck}</option>`;
              });
              
              ppSelect.innerHTML = html;

              if (selectedIdx !== -1) {
                 document.getElementById('hrFilterStartDate').value = hrPayPeriods[selectedIdx].startDate;
                 document.getElementById('hrFilterEndDate').value = hrPayPeriods[selectedIdx].endDate;
              } else {
                 // Fallback if none are completed yet
                 const startLocalDate = new Date(endLocalDate);
                 startLocalDate.setDate(startLocalDate.getDate() - 14);
                 document.getElementById('hrFilterStartDate').value = startLocalDate.toISOString().split('T')[0];
                 document.getElementById('hrFilterEndDate').value = todayStr;
                 ppSelect.value = "custom";
              }

            } else {
              // Default fallback behavior if no pay periods exist
              const startLocalDate = new Date(endLocalDate);
              startLocalDate.setDate(startLocalDate.getDate() - 14);
              const startDateStr = startLocalDate.toISOString().split('T')[0];

              document.getElementById('hrFilterStartDate').value = startDateStr;
              document.getElementById('hrFilterEndDate').value = todayStr;
              document.getElementById('hrPayPeriodContainer').classList.add('hidden');
            }

            checkPayPeriodApprovalState();
            applyHRFilters();
          }

      function loadHRDashboardData() {
        document.getElementById('hrDashboardTableBody').innerHTML = '<tr><td colspan="2" class="p-8 text-center text-gray-400 italic">Loading HR dashboard data...</td></tr>';

        google.script.run
          .withSuccessHandler(res => { if (res.hrData) renderHRDashboardData(res.hrData); })
          .withFailureHandler(err => {
            document.getElementById('hrDashboardTableBody').innerHTML = `<tr><td colspan="2" class="p-8 text-center text-red-600 font-bold">Failed to load: ${escapeHtml(err.message)}</td></tr>`;
          })
          .refreshData(['hrData'], window.activeUserEmail);
      }

      function handleHRDateChange() {
         const ppSelect = document.getElementById('hrPayPeriodSelect');
         if (ppSelect && !document.getElementById('hrPayPeriodContainer').classList.contains('hidden')) {
             const startDateStr = document.getElementById('hrFilterStartDate').value;
             const endDateStr = document.getElementById('hrFilterEndDate').value;

             // Check if dates match any predefined pay period
             let matchFound = false;
             for (let i = 0; i < hrPayPeriods.length; i++) {
                 if (hrPayPeriods[i].startDate === startDateStr && hrPayPeriods[i].endDate === endDateStr) {
                     ppSelect.value = i.toString();
                     matchFound = true;
                     break;
                 }
             }

             if (!matchFound) {
                 ppSelect.value = "custom";
             }
         }
         checkPayPeriodApprovalState();
         applyHRFilters();
      }

      function applyPayPeriodSelection() {
         const ppSelect = document.getElementById('hrPayPeriodSelect');
         const val = ppSelect.value;
         if (val !== "custom" && hrPayPeriods[val]) {
             document.getElementById('hrFilterStartDate').value = hrPayPeriods[val].startDate;
             document.getElementById('hrFilterEndDate').value = hrPayPeriods[val].endDate;
         }
         checkPayPeriodApprovalState();
         applyHRFilters();
      }

      function checkPayPeriodApprovalState() {
          const btn = document.getElementById('btnApprovePayPeriod');
          const ppSelect = document.getElementById('hrPayPeriodSelect');
          if (!btn || !ppSelect) return;

          // Only show button if user has Sub Coordinator or HR role (determined by having HR Dashboard access)
          if (!currentUserPermissions["HR Dashboard"]) {
              btn.classList.add('hidden');
              return;
          }
          btn.classList.remove('hidden');

          const val = ppSelect.value;
          if (val === "custom") {
              btn.disabled = true;
              btn.title = "Cannot approve a custom date range";
              btn.innerHTML = `<span>❌</span> Custom Range`;
          } else if (hrPayPeriods[val]) {
              const isApproved = hrPayPeriods[val].approved === true || hrPayPeriods[val].approved === 'TRUE' || String(hrPayPeriods[val].approved).toLowerCase() === 'true';
              if (isApproved) {
                  btn.disabled = true;
                  btn.title = "This pay period is already approved";
                  btn.innerHTML = `<span>✅</span> Approved`;
              } else {
                  btn.disabled = false;
                  btn.title = "Click to approve this pay period";
                  btn.innerHTML = `<span>✅</span> Approve Pay Period`;
              }
          }
      }

      function handleApprovePayPeriod() {
          const ppSelect = document.getElementById('hrPayPeriodSelect');
          const val = ppSelect.value;
          if (val === "custom" || !hrPayPeriods[val]) return;

          const selectedPP = hrPayPeriods[val];

          showConfirm(`Are you sure you want to approve Pay Period ${escapeHtml(selectedPP.periodNumber)} (${escapeHtml(selectedPP.startDate)} to ${escapeHtml(selectedPP.endDate)})? This will email the current CSV data to HR and Sub Coordinators.`, () => {
              const btn = document.getElementById('btnApprovePayPeriod');
              btn.disabled = true;
              btn.innerHTML = `<span>⏳</span> Approving...`;

              // Force filter to ON to exclude unpaid subs from export, then restore
              const unpaidToggle = document.getElementById('hrFilterUnpaidToggle');
              const originalToggleState = unpaidToggle ? unpaidToggle.checked : false;
              if (unpaidToggle) {
                  unpaidToggle.checked = true;
                  applyHRFilters();
              }

              const csvString = generateCSVString('hrDashboardTable');
              const rangeString = `${selectedPP.startDate} to ${selectedPP.endDate}`;

              if (unpaidToggle) {
                  unpaidToggle.checked = originalToggleState;
                  applyHRFilters();
              }

              google.script.run
                  .withSuccessHandler(res => {
                      if (res && res.success) {
                          showToast(`Pay Period ${selectedPP.periodNumber} approved successfully!`, "success");
                          // Update local state
                          hrPayPeriods[val].approved = true;

                          // Update dropdown option text
                          const option = ppSelect.options[ppSelect.selectedIndex];
                          if (!option.text.includes("✅")) {
                              option.text = option.text + " ✅";
                          }

                          checkPayPeriodApprovalState();
                      } else {
                          showToast("Failed to approve pay period: " + (res ? res.error : "Unknown error"), "error");
                          checkPayPeriodApprovalState(); // reset button state
                      }
                  })
                  .withFailureHandler(err => {
                      showToast("Connection Error: " + err.message, "error");
                      checkPayPeriodApprovalState(); // reset button state
                  })
                  .approvePayPeriod(selectedPP.periodNumber, rangeString, csvString, window.activeUserEmail);
          });
      }


      function applyHRFilters() {
        const startDateStr = document.getElementById('hrFilterStartDate').value;
        const endDateStr = document.getElementById('hrFilterEndDate').value;

        // Filter data by date range
        let filteredData = hrDataRaw.filter(req => {
          let match = true;
          if (startDateStr && req.date < startDateStr) match = false;
          if (endDateStr && req.date > endDateStr) match = false;
          return match;
        });

        let aggregated = {};

        // Extract expected reasons from the DOM dropdown
        let reasonOptions = Array.from(document.getElementById('absReason').options);
        let expectedReasons = reasonOptions.map(opt => opt.value);
        let expectedLabels = reasonOptions.map(opt => opt.text);

        let dynamicReasons = [...expectedReasons];

        if (hrCurrentView === 'absences') {
            filteredData.forEach(req => {
                let teacher = req.teacherName;
                if (!aggregated[teacher]) {
                    aggregated[teacher] = { total: 0 };
                    // Initialize all expected reasons
                    expectedReasons.forEach(r => aggregated[teacher][r] = 0);
                }
                let hours = (req.duration === 'Half Day' ? 4 : 8);

                let reason = req.reason ? req.reason.trim() : "Other";
                let matchedReason = null;

                // Case-insensitive matching against values and labels
                for (let i = 0; i < expectedReasons.length; i++) {
                    if (reason.toLowerCase() === expectedReasons[i].toLowerCase() ||
                        reason.toLowerCase() === expectedLabels[i].toLowerCase()) {
                        matchedReason = expectedReasons[i];
                        break;
                    }
                }

                if (matchedReason) {
                    aggregated[teacher][matchedReason] += hours;
                } else {
                    // It's a legacy or unknown reason
                    let existingDynamic = dynamicReasons.find(r => r.toLowerCase() === reason.toLowerCase());
                    if (existingDynamic) {
                        matchedReason = existingDynamic;
                    } else {
                        matchedReason = reason;
                        dynamicReasons.push(matchedReason);
                    }
                    if (aggregated[teacher][matchedReason] === undefined) {
                        aggregated[teacher][matchedReason] = 0;
                    }
                    aggregated[teacher][matchedReason] += hours;
                }

                aggregated[teacher].total += hours;
            });
        } else {
            // Precompute duty lookup map
            let dutyLookup = {};
            if (staffList && staffList.length > 0) {
                staffList.forEach(s => {
                    dutyLookup[s.name.trim()] = s.duty ? String(s.duty).trim() : null;
                });
            }

            filteredData.forEach(req => {
                req.assignedSubs.forEach(subObj => {
                    let subName = subObj.name;
                    let coveredPeriod = subObj.period;

                    if (subName && subName.toLowerCase() === "no sub needed") {
                        return; // Exclude "No Sub Needed"
                    }

                    if (!aggregated[subName]) {
                        aggregated[subName] = { duties: 0, extras: 0, total: 0, greenExtras: 0, blueGoldExtras: 0, specialPayTotal: 0, details: [] };
                    }

                    let teacherDuty = dutyLookup[subName];
                    let teacherDutyArr = teacherDuty ? String(teacherDuty).split(',').map(d => d.trim()) : [];
                    let isDuty = teacherDutyArr.includes(String(coveredPeriod));

                    let dateColor = hrDateColors[req.date] || "Gold";
                    let individualPay = 0;

                    let specialPayRate = null;
                    try {
                        const parsedSpecial = JSON.parse(hrRates.special || "[]");
                        const specialObj = parsedSpecial.find(r => r.date === req.date);
                        if (specialObj) {
                            specialPayRate = parseFloat(specialObj.rate || 0);
                        }
                    } catch (e) {}

                    let payTypeStr = isDuty ? "Duty" : (specialPayRate !== null ? "Special" : dateColor);

                    if (isDuty) {
                        aggregated[subName].duties += 1;
                    } else {
                        aggregated[subName].extras += 1;
                        if (specialPayRate !== null) {
                            individualPay = specialPayRate;
                            aggregated[subName].specialPayTotal += specialPayRate;
                        } else if (dateColor.toLowerCase() === "green") {
                            aggregated[subName].greenExtras += 1;
                            individualPay = parseFloat(hrRates.green || 0);
                        } else {
                            aggregated[subName].blueGoldExtras += 1;
                            individualPay = parseFloat(hrRates.blueGold || 0);
                        }
                    }
                    aggregated[subName].total += 1;

                    // Add details
                    aggregated[subName].details.push({
                        date: req.date,
                        teacher: req.teacherName,
                        period: coveredPeriod,
                        course: subObj.course || "N/A",
                        payType: payTypeStr,
                        pay: individualPay
                    });
                });
            });
        }

        // Convert to array and filter out 0s
        let resultList = [];
        const filterUnpaid = document.getElementById('hrFilterUnpaidToggle') && document.getElementById('hrFilterUnpaidToggle').checked;

        for (let name in aggregated) {
            if (hrCurrentView === 'absences') {
                if (aggregated[name].total > 0) {
                    resultList.push({ name: name, ...aggregated[name] });
                }
            } else {
                if (aggregated[name].total > 0) {
                    let greenPay = aggregated[name].greenExtras * parseFloat(hrRates.green || 0);
                    let blueGoldPay = aggregated[name].blueGoldExtras * parseFloat(hrRates.blueGold || 0);
                    let extraPay = greenPay + blueGoldPay + (aggregated[name].specialPayTotal || 0);

                    if (filterUnpaid && extraPay <= 0) {
                        continue;
                    }

                    // Sort details by date then period
                    aggregated[name].details.sort((a, b) => {
                        let dateA = new Date(a.date);
                        let dateB = new Date(b.date);
                        if (dateA.getTime() !== dateB.getTime()) {
                            return dateA - dateB;
                        }
                        const pA = String(a.period) === '10' ? 1.5 : (parseInt(a.period) || 0);
                        const pB = String(b.period) === '10' ? 1.5 : (parseInt(b.period) || 0);
                        return pA - pB;
                    });

                    resultList.push({
                        name: name,
                        duties: aggregated[name].duties,
                        extras: aggregated[name].extras,
                        total: aggregated[name].total,
                        greenExtras: aggregated[name].greenExtras,
                        blueGoldExtras: aggregated[name].blueGoldExtras,
                        specialPayTotal: aggregated[name].specialPayTotal,
                        extraPay: extraPay,
                        details: aggregated[name].details
                    });
                }
            }
        }

        // Sort alphabetically
        resultList.sort((a, b) => a.name.localeCompare(b.name));

        renderHRTable(resultList, dynamicReasons, expectedReasons, expectedLabels);
      }

      function renderHRTable(dataList, dynamicReasons, expectedReasons, expectedLabels) {
        const thead = document.getElementById('hrDashboardTableHeader');
        const tbody = document.getElementById('hrDashboardTableBody');

        // Dynamically set headers based on view
        if (hrCurrentView === 'absences') {
          let headerHtml = `
            <tr class="bg-gray-50 border-b border-gray-200 text-sm text-gray-700 uppercase hidden sm:table-row">
              <th class="p-3">Teacher Name</th>
          `;

          dynamicReasons.forEach(reason => {
             let label = reason;
             let idx = expectedReasons.findIndex(r => r === reason);
             if (idx !== -1) {
                 label = expectedLabels[idx];
             }
             if (label === "Professional Development") {
                 label = "PD";
             }
             headerHtml += `<th class="p-3">${escapeHtml(label)}</th>`;
          });

          headerHtml += `<th class="p-3 text-right">Total Hours</th></tr>`;
          thead.innerHTML = headerHtml;
        } else {
          thead.innerHTML = `
            <tr class="bg-gray-50 border-b border-gray-200 text-sm text-gray-700 uppercase hidden sm:table-row">
              <th class="p-3">Teacher Name</th>
              <th class="p-3 text-right">Duties</th>
              <th class="p-3 text-right">Extras</th>
              <th class="p-3 text-right">Extra (Pay)</th>
              <th class="p-3 text-right">Totals</th>
            </tr>
          `;
        }

        const colCount = hrCurrentView === 'absences' ? (2 + (dynamicReasons ? dynamicReasons.length : 0)) : 5;

        if (dataList.length === 0) {
          tbody.innerHTML = `<tr><td colspan="${escapeHtml(colCount)}" class="p-8 text-center text-gray-400 italic hidden sm:table-cell">No data found for the selected dates.</td><td class="p-8 text-center text-gray-400 italic block sm:hidden">No data found for the selected dates.</td></tr>`;
          return;
        }

        let html = '';
        dataList.forEach(item => {
          if (hrCurrentView === 'absences') {
            html += `
              <tr class="hover:bg-gray-50 transition-colors border-b border-gray-100 last:border-b-0">
                <!-- Mobile View -->
                <td class="p-3 block sm:hidden">
                    <div class="font-bold text-[#002147] mb-2">${escapeHtml(item.name)}</div>
                    <div class="grid grid-cols-2 gap-2 text-sm">
                        ${dynamicReasons.map(reason => `<div><span class="font-semibold text-gray-600">${reason}:</span> ${escapeHtml(item[reason]) || 0}</div>`).join('')}
                        <div class="col-span-2 pt-2 mt-1 border-t border-gray-100"><span class="font-bold text-gray-800">Total Hours:</span> ${escapeHtml(item.total) || 0}</div>
                    </div>
                </td>
                <!-- Desktop View -->
                <td class="p-3 text-sm text-gray-800 font-medium hidden sm:table-cell">${escapeHtml(item.name)}</td>
            `;

            dynamicReasons.forEach(reason => {
                html += `<td class="p-3 text-sm text-gray-600 font-bold hidden sm:table-cell">${escapeHtml(item[reason]) || 0}</td>`;
            });

            html += `
                <td class="p-3 text-sm text-gray-600 font-bold text-right hidden sm:table-cell">${escapeHtml(item.total) || 0}</td>
              </tr>
            `;
          } else {
            let breakdownText = `${escapeHtml(item.greenExtras)} Green, ${escapeHtml(item.blueGoldExtras)} Blue/Gold`;
            let extraPayFormatted = '$' + Number(item.extraPay).toFixed(2);
            let exportText = `${escapeHtml(extraPayFormatted)} (${escapeHtml(breakdownText)})`;

            let safeName = item.name.replace(/[^a-zA-Z0-9]/g, '');
            let detailsId = `hr-detail-${safeName}-${Math.random().toString(36).substr(2, 9)}`;

            let detailsHtml = '';
            if (item.details && item.details.length > 0) {
                detailsHtml = `
                <div class="p-4 bg-gray-50 border border-gray-200 rounded-lg mx-2 mb-2 overflow-x-auto shadow-inner">
                    <table class="w-full text-left border-collapse text-xs">
                        <thead>
                            <tr class="text-gray-500 uppercase border-b border-gray-300">
                                <th class="pb-2 pr-2">Date</th>
                                <th class="pb-2 pr-2">Teacher</th>
                                <th class="pb-2 pr-2">Class</th>
                                <th class="pb-2 pr-2">Type</th>
                                <th class="pb-2 text-right">Pay</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-200">
                            ${item.details.map(d => `
                            <tr class="hover:bg-gray-100 transition-colors">
                                <td class="py-2 pr-2 whitespace-nowrap">${escapeHtml(d.date)}</td>
                                <td class="py-2 pr-2 truncate max-w-[150px]" title="${escapeHtml(d.teacher)}">${escapeHtml(d.teacher)}</td>
                                <td class="py-2 pr-2">${formatPeriodLabel(d.period, d.date)}: ${escapeHtml(d.course)}</td>
                                <td class="py-2 pr-2 whitespace-nowrap">
                                    <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${
                                        d.payType === 'Duty' ? 'bg-gray-200 text-gray-700' :
                                        d.payType.toLowerCase() === 'green' ? 'bg-green-100 text-green-800' :
                                        'bg-blue-100 text-blue-800'
                                    }">${escapeHtml(d.payType)}</span>
                                </td>
                                <td class="py-2 text-right font-medium">${d.pay > 0 ? '$' + d.pay.toFixed(2) : '-'}</td>
                            </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>`;
            }

            html += `
              <tr class="hover:bg-gray-100 transition-colors border-b border-gray-100 last:border-b-0 cursor-pointer" onclick="document.getElementById('${escapeJs(detailsId)}').classList.toggle('hidden')">
                <!-- Mobile View -->
                <td class="p-3 block sm:hidden">
                    <div class="font-bold text-[#002147] mb-2">${escapeHtml(item.name)} <span class="text-xs text-gray-400 ml-2">▼</span></div>
                    <div class="grid grid-cols-2 gap-2 text-sm">
                        <div><span class="font-semibold text-gray-600">Duties:</span> ${escapeHtml(item.duties)}</div>
                        <div><span class="font-semibold text-gray-600">Extras:</span> ${escapeHtml(item.extras)}</div>
                        <div class="col-span-2">
                            <span class="font-semibold text-gray-600">Extra (Pay):</span>
                            <span class="text-[#00843D] font-bold">${escapeHtml(extraPayFormatted)}</span>
                            <div class="mt-1 text-xs text-gray-500">${breakdownText}</div>
                        </div>
                        <div class="col-span-2 pt-2 mt-1 border-t border-gray-100"><span class="font-bold text-gray-800">Totals:</span> ${escapeHtml(item.total)}</div>
                    </div>
                </td>
                <!-- Desktop View -->
                <td class="p-3 text-sm text-gray-800 font-medium hidden sm:table-cell">
                    <div class="flex items-center justify-between">
                        <span>${escapeHtml(item.name)}</span>
                        <span class="text-xs text-gray-400 ml-2">▼</span>
                    </div>
                </td>
                <td class="p-3 text-sm text-gray-600 font-bold text-right hidden sm:table-cell">${escapeHtml(item.duties)}</td>
                <td class="p-3 text-sm text-gray-600 font-bold text-right hidden sm:table-cell">${escapeHtml(item.extras)}</td>
                <td class="p-3 text-sm text-[#00843D] font-bold text-right hidden sm:table-cell" data-export="${escapeHtml(exportText)}">
                    ${escapeHtml(extraPayFormatted)}
                </td>
                <td class="p-3 text-sm text-gray-600 font-bold text-right hidden sm:table-cell">${escapeHtml(item.total)}</td>
              </tr>
              <!-- Expandable Details Row -->
              <tr id="${detailsId}" class="hidden hr-detail-row bg-gray-50/50">
                <td colspan="5" class="p-0 border-b border-gray-200">
                    ${detailsHtml}
                </td>
              </tr>
            `;
          }
        });

        tbody.innerHTML = html;
      }

      function copyHRData() {
        const table = document.getElementById('hrDashboardTable');
        if (!table) return;

        let tsv = '';

        // Get headers
        const headers = Array.from(table.querySelectorAll(':scope > thead tr.sm\\:table-row th, :scope > thead tr:not(.sm\\:table-row) th'))
            .filter(th => !th.classList.contains('sm:hidden'))
            .map(th => {
                let text = th.textContent.trim();
                if (/^[=+\-@\t\r]/.test(text)) {
                    text = "'" + text;
                }
                return text;
            });
        tsv += headers.join('\t') + '\n';

        // Get rows (only immediate children of tbody to exclude nested sub-tables)
        const tbody = table.querySelector('tbody');
        if (!tbody) return;

        const rows = Array.from(tbody.querySelectorAll(':scope > tr'));
        rows.forEach(tr => {
            // Check if this is the details row, we skip it for copying summary data
            if (tr.classList.contains('hr-detail-row')) return;

            // Check if this is the "Loading" or "No data" row
            const allCols = tr.querySelectorAll(':scope > td');
            if (allCols.length === 1 && allCols[0].hasAttribute('colspan')) return;

            const cols = Array.from(allCols).filter(td => !td.classList.contains('sm:hidden'));

            const rowData = cols.map(td => {
                let text = td.getAttribute('data-export');
                if (!text) {
                    // Extract text but remove the arrow character
                    text = td.textContent.trim().replace(/▼/g, '').trim();
                }
                if (/^[=+\-@\t\r]/.test(text)) {
                    text = "'" + text;
                }
                return text;
            });
            tsv += rowData.join('\t') + '\n';
        });

        if (tsv.trim() === '') {
            showToast('No data to copy.', 'info');
            return;
        }

        navigator.clipboard.writeText(tsv).then(() => {
            const btn = document.querySelector('button[onclick="copyHRData()"]');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<span>✅</span> Copied!';
            setTimeout(() => {
                btn.innerHTML = originalHTML;
            }, 2000);
        }).catch(err => {
            console.error('Failed to copy text: ', err);
            showToast('Failed to copy data to clipboard.', 'error');
        });
      }

</script>
