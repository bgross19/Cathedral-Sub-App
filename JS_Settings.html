<script>
      // === Settings Dashboard Tab Switching ===
      function switchSettingsTab(tabId) {
        if (tabId === 'bellScheduleTab' && typeof loadBellScheduleSettings === 'function') {
           loadBellScheduleSettings();
        }
        if (tabId === 'staffRosterTab' && typeof loadStaffRosterSettings === 'function') {
           loadStaffRosterSettings();
        }
        if (tabId === 'hrSettingsTab' && typeof loadPayPeriodsSettings === 'function') {
           loadPayPeriodsSettings();
        }
        if (tabId === 'dataManagementTab' && typeof loadEmailQueueStatus === 'function') {
           loadEmailQueueStatus();
        }
        // Hide all tabs
        const tabs = document.querySelectorAll('.settings-tab-content');
        tabs.forEach(tab => {
          tab.classList.remove('block');
          tab.classList.add('hidden');
        });

        // Reset all tab buttons
        const tabBtns = ['generalSettingsTab', 'bellScheduleTab', 'staffRosterTab', 'auditLogsTab', 'hrSettingsTab', 'dataManagementTab'];
        tabBtns.forEach(btn => {
          const btnEl = document.getElementById('btn-' + btn);
          if (btnEl) {
            btnEl.classList.remove('text-[#002147]', 'font-semibold', 'border-b-2', 'border-[#002147]');
            btnEl.classList.add('text-gray-500', 'font-medium');
          }
        });

        // Show active tab
        const activeTab = document.getElementById(tabId);
        if (activeTab) {
          activeTab.classList.remove('hidden');
          activeTab.classList.add('block');
        }

        // Highlight active tab button
        const activeBtn = document.getElementById('btn-' + tabId);
        if (activeBtn) {
          activeBtn.classList.remove('text-gray-500', 'font-medium');
          activeBtn.classList.add('text-[#002147]', 'font-semibold', 'border-b-2', 'border-[#002147]');
        }
      }

      // === Staff Roster Logic ===
      let currentStaffRoster = [];

      function loadStaffRosterSettings() {
        const tbody = document.getElementById('staffRosterTableBody');
        tbody.innerHTML = '<tr><td colspan="4" class="p-8 text-center text-gray-400 italic">Loading staff roster...</td></tr>';
        google.script.run
          .withSuccessHandler(roster => {
            currentStaffRoster = roster;
            renderStaffRosterTable();
          })
          .withFailureHandler(err => {
            tbody.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-red-600 font-bold">Failed to load roster: ${escapeHtml(err.message)}</td></tr>`;
          })
          .getStaffRosterForAdmin(window.activeUserEmail);
      }

      function renderStaffRosterTable() {
        const tbody = document.getElementById('staffRosterTableBody');
        if (currentStaffRoster.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" class="p-8 text-center text-gray-400 italic">No staff found.</td></tr>';
          return;
        }

        let html = '';
        currentStaffRoster.forEach((staff, idx) => {
          let role = staff.role ? staff.role.trim() : "Teacher";
          const allRoles = ["Teacher", "Substitute", "Admin", "HR", "Principal", "Sub Coordinator"];

          let roleHtml = `
              <select onchange="updateStaffRoleInline('${escapeJs(staff.email)}', this.value)" class="p-1 border rounded focus:ring-1 focus:ring-[#00843D] outline-none text-sm bg-white">
          `;

          allRoles.forEach(r => {
              const isSelected = (role.toLowerCase() === r.toLowerCase()) ? 'selected' : '';
              roleHtml += `<option value="${escapeHtml(r)}" ${isSelected}>${escapeHtml(r)}</option>`;
          });

          roleHtml += `</select>`;

          let dutyArr = staff.duty ? String(staff.duty).split(',').map(d => d.trim()) : [];
          let dutyDisplay = dutyArr.length > 0 ? dutyArr.join(', ') : 'None';

          let dutyOptionsHtml = '';
          for (let i = 1; i <= 8; i++) {
              let isChecked = dutyArr.includes(String(i)) ? 'checked' : '';
              dutyOptionsHtml += `
                  <label class="flex items-center space-x-2 p-1 hover:bg-gray-100 cursor-pointer text-sm">
                      <input type="checkbox" value="${i}" ${isChecked} onchange="handleDutyCheckboxChange('${escapeJs(staff.email)}', this)" class="form-checkbox h-4 w-4 text-[#00843D]">
                      <span>Period ${i}</span>
                  </label>
              `;
          }

          let dutyDropdownId = 'duty-dropdown-' + staff.email.replace(/[^a-zA-Z0-9]/g, '-');
          let dutyHtml = `
              <div class="relative inline-block text-left duty-dropdown-container">
                  <button type="button" onclick="toggleDutyDropdown('${dutyDropdownId}')" class="inline-flex justify-between w-full p-1 border rounded focus:ring-1 focus:ring-[#00843D] outline-none text-sm bg-white text-gray-700 hover:bg-gray-50">
                      <span id="duty-display-${dutyDropdownId}">${escapeHtml(dutyDisplay)}</span>
                      <svg class="-mr-1 ml-2 h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                          <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
                      </svg>
                  </button>
                  <div id="${dutyDropdownId}" class="hidden origin-top-right absolute right-0 mt-1 w-32 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5 z-10">
                      <div class="py-1" role="menu" aria-orientation="vertical">
                          ${dutyOptionsHtml}
                      </div>
                  </div>
              </div>
          `;

          html += `
            <tr class="hover:bg-gray-50 transition-colors border-b border-gray-100 last:border-b-0">
              <td class="p-3 text-sm text-gray-800 font-medium">${escapeHtml(staff.name)}</td>
              <td class="p-3 text-sm text-gray-600">${escapeHtml(staff.email)}</td>
              <td class="p-3 text-sm text-gray-600">${roleHtml}</td>
              <td class="p-3 text-sm text-gray-600">${dutyHtml}</td>
              <td class="p-3 text-right space-x-2">
                <button onclick="openEditStaffModal('${escapeJs(staff.name)}', '${escapeJs(staff.email)}', '${escapeJs(staff.role || '')}', '${escapeJs(staff.duty || '')}')" class="text-blue-600 hover:text-blue-800 font-semibold text-sm">Edit</button>
                <button onclick="deleteStaffMember('${escapeJs(staff.email)}')" class="text-red-600 hover:text-red-800 font-semibold text-sm">Delete</button>
              </td>
            </tr>
          `;
        });
        tbody.innerHTML = html;
      }

      function updateStaffRoleInline(email, newRole) {
          google.script.run
              .withSuccessHandler(result => {
                  if (result && result.success) {
                      showToast("Role updated successfully.", "success");
                      loadStaffRosterSettings();
                  } else {
                      showToast("Failed to update role: " + (result ? result.error : "Unknown error"), "error");
                      loadStaffRosterSettings(); // revert
                  }
              })
              .withFailureHandler(err => {
                  showToast("Connection Error: " + err.message, 'error');
                  loadStaffRosterSettings(); // revert
              })
              .updateStaffRoleInlineAdmin(email, newRole, window.activeUserEmail);
      }

      function updateStaffDutyInline(email, newDuty) {
          google.script.run
              .withSuccessHandler(result => {
                  if (result && result.success) {
                      showToast("Duty updated successfully.", "success");
                      loadStaffRosterSettings();
                  } else {
                      showToast("Failed to update duty: " + (result ? result.error : "Unknown error"), "error");
                      loadStaffRosterSettings(); // revert
                  }
              })
              .withFailureHandler(err => {
                  showToast("Connection Error: " + err.message, 'error');
                  loadStaffRosterSettings(); // revert
              })
              .updateStaffDutyInlineAdmin(email, newDuty, window.activeUserEmail);
      }

      function toggleDutyDropdown(dropdownId) {
          const dropdown = document.getElementById(dropdownId);
          if (dropdown.classList.contains('hidden')) {
              // Close all other dropdowns
              document.querySelectorAll('.duty-dropdown-container > div:not(.hidden)').forEach(el => {
                  el.classList.add('hidden');
              });
              dropdown.classList.remove('hidden');
          } else {
              dropdown.classList.add('hidden');
          }
      }

      function handleDutyCheckboxChange(email, checkbox) {
          // Find the container for this dropdown
          const dropdownContainer = checkbox.closest('.duty-dropdown-container');
          const checkboxes = dropdownContainer.querySelectorAll('input[type="checkbox"]');

          let selectedDuties = [];
          checkboxes.forEach(cb => {
              if (cb.checked) {
                  selectedDuties.push(cb.value);
              }
          });

          const newDutyStr = selectedDuties.join(', ');

          // Update display
          const dropdownId = dropdownContainer.querySelector('div[id^="duty-dropdown-"]').id;
          const displaySpan = document.getElementById('duty-display-' + dropdownId);
          displaySpan.innerText = newDutyStr || 'None';

          updateStaffDutyInline(email, newDutyStr);
      }

      // Close duty dropdowns when clicking outside
      document.addEventListener('click', function(event) {
          if (!event.target.closest('.duty-dropdown-container')) {
              document.querySelectorAll('.duty-dropdown-container > div:not(.hidden)').forEach(el => {
                  el.classList.add('hidden');
              });
          }
      });

      function copyStaffRosterData() {
        if (!currentStaffRoster || currentStaffRoster.length === 0) {
           showToast("No data to copy.", 'info');
           return;
        }

        function sanitizeTSV(text) {
           if (typeof text !== 'string') text = String(text || '');
           if (/^[=+\-@\t\r]/.test(text)) {
              return "'" + text;
           }
           return text;
        }

        let tsvText = "LASTFIRST\tEMAIL_ADDR\tRole\tDuty\n";
        currentStaffRoster.forEach(staff => {
           const name = sanitizeTSV(staff.name);
           const email = sanitizeTSV(staff.email);
           const role = sanitizeTSV(staff.role || 'Teacher');
           const duty = sanitizeTSV(staff.duty || '');
           tsvText += `${name}\t${email}\t${role}\t${duty}\n`;
        });
        navigator.clipboard.writeText(tsvText).then(() => {
           showToast("Staff roster copied to clipboard as TSV!", 'info');
        }).catch(err => {
           showToast("Failed to copy data: " + err, "error");
        });
      }

      function saveStaffMember() {
        const originalEmail = document.getElementById('staffOriginalEmail').value;
        const name = document.getElementById('staffNameInput').value;
        const email = document.getElementById('staffEmailInput').value;
        const role = document.getElementById('staffRoleInput').value;

        let selectedDuties = [];
        document.querySelectorAll('.staff-duty-cb:checked').forEach(cb => selectedDuties.push(cb.value));
        const duty = selectedDuties.join(', ');

        // Keep hidden input in sync (optional, but good for captureModalState)
        document.getElementById('staffDutyInput').value = duty;

        if (!name || !email) {
          showToast("Name and Email are required.", 'info');
          return;
        }

        const btn = document.getElementById('saveStaffBtn');
        const originalText = btn.innerText;
        btn.disabled = true;
        btn.innerText = "Saving...";

        const staffData = {
           originalEmail: originalEmail,
           name: name,
           email: email,
           role: role,
           duty: duty
        };

        google.script.run
          .withSuccessHandler(result => {
             btn.disabled = false;
             btn.innerText = originalText;
             if (result && result.success) {
                originalModalData = {};
                closeAllModals();
                document.getElementById('staffNameInput').value = '';
                document.getElementById('staffEmailInput').value = '';
                document.getElementById('staffRoleInput').value = 'Teacher';
                document.getElementById('staffDutyInput').value = '';
                loadStaffRosterSettings();
             } else {
                showToast("Failed to save staff member: " + (result ? result.error : "Unknown error"), "error");
             }
          })
          .withFailureHandler(err => {
             btn.disabled = false;
             btn.innerText = originalText;
             showToast("Connection Error: " + err.message, 'error');
          })
          .saveStaffMemberAdmin(staffData, window.activeUserEmail);
      }

      function deleteStaffMember(email) {
        showConfirm(`Are you sure you want to delete ${escapeHtml(email)} from the staff roster?`, () => {
        google.script.run
          .withSuccessHandler(result => {
             if (result && result.success) {
                loadStaffRosterSettings();
             } else {
                showToast("Failed to delete staff member: " + (result ? result.error : "Unknown error"), "error");
             }
          })
          .withFailureHandler(err => {
             showToast("Connection Error: " + err.message, 'error');
          })
          .deleteStaffMemberAdmin(email, window.activeUserEmail);
      });
      }

      function clearAllDutiesClient() {
        showConfirm("Are you sure you want to clear the assigned duties? This action cannot be easily undone", () => {
          const btn = document.getElementById('clearDutiesBtn');
          const originalText = btn.innerHTML;
          btn.disabled = true;
          btn.innerHTML = '<span>⏳</span> Clearing...';

          google.script.run
            .withSuccessHandler(result => {
              btn.disabled = false;
              btn.innerHTML = originalText;
              if (result && result.success) {
                showToast("All duties have been successfully cleared.", "success");
                loadStaffRosterSettings();
              } else {
                showToast("Failed to clear duties: " + (result ? result.error : "Unknown error"), "error");
              }
            })
            .withFailureHandler(err => {
              btn.disabled = false;
              btn.innerHTML = originalText;
              showToast("Error: " + err.message, "error");
            })
            .clearAllStaffDuties(window.activeUserEmail);
        });
      }

      function processStaffCsvUpload() {
         const fileInput = document.getElementById('staffCsvFileInput');
         const textarea = document.getElementById('staffCsvTextarea');

         if (fileInput.files.length > 0) {
            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
               parseAndSubmitStaffCsv(e.target.result);
               fileInput.value = ""; // clear input
            };
            reader.readAsText(file);
         } else if (textarea.value.trim() !== "") {
            parseAndSubmitStaffCsv(textarea.value);
            textarea.value = ""; // clear textarea
         } else {
            showToast("Please select a CSV file or paste Data.", 'error');
         }
      }

      function parseAndSubmitStaffCsv(csvText) {
         const lines = csvText.split(/\r?\n/).filter(line => line.trim() !== '');
         if (lines.length === 0) {
            showToast("Data is empty.", 'info');
            return;
         }

         let delimiter = ',';
         if (lines[0].includes('\t')) {
             delimiter = '\t';
         }



         const firstLine = parseCsvLine(lines[0], delimiter);
         const firstLineUpper = firstLine.map(s => s.toUpperCase());

         const hasHeaders = firstLineUpper.includes('LASTFIRST') || firstLineUpper.includes('EMAIL_ADDR') || firstLineUpper.includes('DUTY');
         const startIndex = hasHeaders ? 1 : 0;

         if (lines.length <= startIndex) {
            showToast("Data contains no data rows.", 'info');
            return;
         }

         const updates = [];
         for (let i = startIndex; i < lines.length; i++) {
            let row = parseCsvLine(lines[i], delimiter);
            if (row.length === 0 || (row.length === 1 && row[0] === '')) continue;

            let email = "";
            let name = "";
            let role = "Teacher";
            let duty = "";

            let emailColIdx = -1;
            for (let c = row.length - 1; c >= 0; c--) {
                if (row[c].includes('@')) {
                    emailColIdx = c;
                    break;
                }
            }

            if (emailColIdx !== -1) {
                email = row[emailColIdx];
                name = row.slice(0, emailColIdx).join(', ');

                // If there are two columns after email, assume Role then Duty
                if (emailColIdx + 2 < row.length) {
                    role = row[emailColIdx + 1] || "Teacher";
                    duty = row[emailColIdx + 2];
                }
                // If there is only one column after email, backwards compatibility: it could be role or duty
                else if (emailColIdx + 1 < row.length) {
                    let val = row[emailColIdx + 1].trim();
                    if (val.toLowerCase() === "teacher" || val.toLowerCase() === "substitute") {
                        role = val;
                        duty = "";
                    } else {
                        role = "Teacher";
                        duty = val;
                    }
                }
            } else {
                if (row.length >= 3) {
                    email = row[row.length - 3];
                    role = row[row.length - 2];
                    duty = row[row.length - 1];
                    name = row.slice(0, row.length - 3).join(', ');
                } else if (row.length === 2) {
                    email = row[row.length - 2];
                    duty = row[row.length - 1];
                    name = row.slice(0, row.length - 2).join(', ');
                } else {
                    name = row[0];
                }
            }

            name = name.replace(/^"|"$/g, '');
            if (name.includes(',') && name.split(',').length === 2) {
                const parts = name.split(',');
                name = parts[1].trim() + ' ' + parts[0].trim();
            } else {
                name = name.trim();
            }

            email = email.replace(/^"|"$/g, '').trim();
            role = role.replace(/^"|"$/g, '').trim() || "Teacher";
            duty = duty.replace(/^"|"$/g, '').trim();

            if (name && email) {
                updates.push({name: name, email: email, role: role, duty: duty});
            }
         }

         if (updates.length === 0) {
            showToast("No valid rows found to process. Make sure each row contains a name and an email address.", 'info');
            return;
         }

         showConfirm(`Are you sure you want to process ${escapeHtml(updates.length)} staff records? Existing records with the same email will be updated.`, () => {
             google.script.run
            .withSuccessHandler(result => {
               if (result && result.success) {
                  showToast(`Successfully processed ${result.updated} records.`, 'success');
                  loadStaffRosterSettings();
               } else {
                  showToast("Failed to process Data: " + (result ? result.error : "Unknown error"), "error");
               }
            })
            .withFailureHandler(err => {
               showToast("Connection Error: " + err.message, 'error');
            })
            .bulkUpsertStaffRoster(updates, window.activeUserEmail);
         });
      }


      // === Pay Periods Logic ===
      let currentPayPeriodsSettings = [];
      let currentSpecialPayRates = [];

      function renderSpecialPayRates() {
          const list = document.getElementById('specialPayRatesList');
          list.innerHTML = '';
          if (currentSpecialPayRates.length === 0) {
              list.innerHTML = '<p class="text-sm text-gray-400 italic">No special pay rates configured.</p>';
              return;
          }
          currentSpecialPayRates.forEach((rateObj, index) => {
              const div = document.createElement('div');
              div.className = 'flex justify-between items-center p-3 bg-gray-50 border rounded-lg';
              div.innerHTML = `
                  <div>
                      <span class="font-bold text-gray-700">${escapeHtml(rateObj.date)}</span>
                      <span class="ml-2 text-gray-600">Rate: $${escapeHtml(String(rateObj.rate))}</span>
                  </div>
                  <button onclick="removeSpecialPayRate(${index})" class="text-red-500 hover:text-red-700 font-bold px-2 py-1">Remove</button>
              `;
              list.appendChild(div);
          });
      }

      function addSpecialPayRate() {
          const dateInput = document.getElementById('newSpecialPayRateDate');
          const valueInput = document.getElementById('newSpecialPayRateValue');
          if (!dateInput.value || !valueInput.value) {
              showToast("Please enter both a date and a rate.", "error");
              return;
          }
          const existing = currentSpecialPayRates.find(r => r.date === dateInput.value);
          if (existing) {
              existing.rate = valueInput.value;
          } else {
              currentSpecialPayRates.push({ date: dateInput.value, rate: valueInput.value });
          }
          // Sort by date
          currentSpecialPayRates.sort((a, b) => a.date.localeCompare(b.date));
          dateInput.value = '';
          valueInput.value = '';
          renderSpecialPayRates();
      }

      function removeSpecialPayRate(index) {
          currentSpecialPayRates.splice(index, 1);
          renderSpecialPayRates();
      }

      function saveDayPayRates() {
        const btn = document.getElementById('saveDayPayRatesBtn');
        const originalText = btn.innerText;
        btn.disabled = true;
        btn.innerText = "Saving...";

        const newSettings = {
          "Green Day Pay Rate": document.getElementById('settingsGreenDayRate').value,
          "Blue/Gold Day Pay Rate": document.getElementById('settingsBlueGoldDayRate').value,
          "Special Pay Rates": JSON.stringify(currentSpecialPayRates)
        };

        google.script.run
          .withSuccessHandler(result => {
             btn.disabled = false;
             btn.innerText = originalText;
             if (result && result.success) {
                showToast("Pay rates saved successfully!", "success");
             } else {
                showToast("Failed to save: " + (result ? result.error : "Unknown"), "error");
             }
          })
          .withFailureHandler(err => {
             btn.disabled = false;
             btn.innerText = originalText;
             showToast("Error: " + err.message, "error");
          })
          .updateSettings(newSettings, window.activeUserEmail);
      }

      function loadPayPeriodsSettings() {
        // Also load the Day Pay Rates
        google.script.run
          .withSuccessHandler(settings => {
             if (settings) {
                document.getElementById('settingsGreenDayRate').value = settings["Green Day Pay Rate"] || "10";
                document.getElementById('settingsBlueGoldDayRate').value = settings["Blue/Gold Day Pay Rate"] || "20";
                try {
                    currentSpecialPayRates = JSON.parse(settings["Special Pay Rates"] || "[]");
                } catch (e) {
                    currentSpecialPayRates = [];
                }
                renderSpecialPayRates();
             }
          })
          .getSettingsForFrontend(window.activeUserEmail);

        const tbody = document.getElementById('payPeriodsTableBody');
        tbody.innerHTML = '<tr><td colspan="3" class="p-8 text-center text-gray-400 italic">Loading pay periods...</td></tr>';
        google.script.run
          .withSuccessHandler(periods => {
            currentPayPeriodsSettings = periods;
            renderPayPeriodsTable();
          })
          .withFailureHandler(err => {
            tbody.innerHTML = `<tr><td colspan="3" class="p-8 text-center text-red-600 font-bold">Failed to load pay periods: ${escapeHtml(err.message)}</td></tr>`;
          })
          .loadPayPeriodsSettings(window.activeUserEmail);

        // Also set default date for Principal's Digest to next Friday
        const today = new Date();
        const nextFriday = new Date(today);
        nextFriday.setDate(today.getDate() + (5 + 7 - today.getDay()) % 7);
        if (today.getDay() === 5) {
           nextFriday.setDate(today.getDate() + 7);
        }
        const offset = nextFriday.getTimezoneOffset() * 60000;
        const localFriday = new Date(nextFriday - offset);
        document.getElementById('principalsDigestDate').value = localFriday.toISOString().split('T')[0];
      }

      function renderPayPeriodsTable() {
        const tbody = document.getElementById('payPeriodsTableBody');
        if (currentPayPeriodsSettings.length === 0) {
          tbody.innerHTML = '<tr><td colspan="3" class="p-8 text-center text-gray-400 italic">No pay periods found.</td></tr>';
          return;
        }

        let html = '';
        currentPayPeriodsSettings.forEach((pp) => {
          html += `
            <tr class="hover:bg-gray-50 transition-colors border-b border-gray-100 last:border-b-0">
              <td class="p-3 text-sm text-gray-800 font-medium">${escapeHtml(pp.period)}</td>
              <td class="p-3 text-sm text-gray-600">${escapeHtml(pp.start)}</td>
              <td class="p-3 text-sm text-gray-600">${escapeHtml(pp.end)}</td>
            </tr>
          `;
        });
        tbody.innerHTML = html;
      }

      function deleteAllPayPeriodsClient() {
        showConfirm('Are you sure you want to delete all pay periods? This cannot be undone.', () => {
          google.script.run
            .withSuccessHandler(result => {
               if (result && result.success) {
                  showToast('All pay periods deleted.', 'success');
                  loadPayPeriodsSettings();
               } else {
                  showToast("Failed to delete pay periods: " + (result ? result.error : "Unknown error"), "error");
               }
            })
            .withFailureHandler(err => {
               showToast("Connection Error: " + err.message, 'error');
            })
            .deleteAllPayPeriods(window.activeUserEmail);
        });
      }

      function processPayPeriodsCsvUpload() {
         const fileInput = document.getElementById('payPeriodsCsvFileInput');
         const textarea = document.getElementById('payPeriodsCsvTextarea');

         if (fileInput.files.length > 0) {
            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
               parseAndSubmitPayPeriodsCsv(e.target.result);
               fileInput.value = ""; // clear input
            };
            reader.readAsText(file);
         } else if (textarea.value.trim() !== "") {
            parseAndSubmitPayPeriodsCsv(textarea.value);
            textarea.value = ""; // clear textarea
         } else {
            showToast("Please select a CSV file or paste CSV/TSV data.", 'error');
         }
      }

      function parseAndSubmitPayPeriodsCsv(csvText) {
         const lines = csvText.split(/\r?\n/).filter(line => line.trim() !== '');
         if (lines.length === 0) {
            showToast("Data is empty.", 'info');
            return;
         }

         let delimiter = ',';
         if (lines[0].includes('	')) {
             delimiter = '	';
         }

         const firstLine = parseCsvLine(lines[0], delimiter);
         const firstLineUpper = firstLine.map(s => s.toUpperCase());

         const hasHeaders = firstLineUpper.includes('PAYCHECK') || firstLineUpper.includes('PERIOD START') || firstLineUpper.includes('PERIOD END');
         const startIndex = hasHeaders ? 1 : 0;

         if (lines.length <= startIndex) {
            showToast("Data contains no rows.", 'info');
            return;
         }

         const updates = [];
         for (let i = startIndex; i < lines.length; i++) {
            let row = parseCsvLine(lines[i], delimiter);
            if (row.length < 3) continue;

            let period = row[0].replace(/^"|"$/g, '').trim();
            let start = row[1].replace(/^"|"$/g, '').trim();
            let end = row[2].replace(/^"|"$/g, '').trim();

            if (period && start && end) {
                updates.push({period: period, start: start, end: end});
            }
         }

         if (updates.length === 0) {
            showToast("No valid rows found to process. Make sure each row contains Period, Start Date, and End Date.", 'info');
            return;
         }

         showConfirm(`Are you sure you want to process ${escapeHtml(updates.length)} pay periods? Existing ones will not be deleted but they will be appended to the bottom. Consider deleting all current pay periods first if replacing them.`, () => {
             google.script.run
            .withSuccessHandler(result => {
               if (result && result.success) {
                  showToast(`Successfully added ${result.updated} pay periods.`, 'success');
                  loadPayPeriodsSettings();
               } else {
                  showToast("Failed to process data: " + (result ? result.error : "Unknown error"), "error");
               }
            })
            .withFailureHandler(err => {
               showToast("Connection Error: " + err.message, 'error');
            })
            .bulkUpsertPayPeriods(updates, window.activeUserEmail);
         });
      }

         checkboxes.forEach(cb => {
            const role = cb.dataset.role;
            const view = cb.dataset.view;

            newMatrix[role][view] = cb.checked;
         });

         // Enforce Admin -> Settings is true
         if (!newMatrix['admin']) newMatrix['admin'] = {};
         newMatrix['admin']['Settings'] = true;

         const settingsToUpdate = {
             "RolePermissions": JSON.stringify(newMatrix)
         };

         showToast('Saving permissions...', 'info');
         google.script.run
          .withSuccessHandler(() => {
             showToast('Permissions saved successfully! Reloading...', 'success');
             rolePermissionsMatrix = newMatrix;
             setTimeout(() => { location.reload() }, 1000);

      function exportAllAbsenceRequestsClient() {
        const btn = document.getElementById('btn-exportAllData');
        const originalText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span>⏳</span> Exporting...';

        google.script.run
          .withSuccessHandler(data => {
            btn.disabled = false;
            btn.innerHTML = originalText;
            if (!data || data.length === 0) {
               showToast("No data found to export.", "info");
               return;
            }

            try {
              let csvContent = "";
              data.forEach(row => {
                 let rowStr = row.map(val => {
                    if (val === null || val === undefined) return '""';
                    // Check if it's a date string that needs formatting
                    let strVal = String(val);
                    if (strVal.includes('GMT') || strVal.includes('Z')) {
                        let tryDate = new Date(val);
                        if (!isNaN(tryDate.getTime())) {
                            strVal = tryDate.toISOString().split('T')[0];
                        }
                    }

                    if (/^[=+\-@\t\r]/.test(strVal)) {
                        strVal = "'" + strVal;
                    }

                    strVal = strVal.replace(/"/g, '""');
                    if (strVal.search(/("|,|\n)/g) >= 0) {
                        strVal = `"${strVal}"`;
                    }
                    return strVal;
                 }).join(",");
                 csvContent += rowStr + "\r\n";
              });
              const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
              const link = document.createElement("a");
              const url = URL.createObjectURL(blob);
              link.setAttribute("href", url);
              link.setAttribute("download", "All_Absence_Requests.csv");
              document.body.appendChild(link);
              link.click();
              document.body.removeChild(link);
              URL.revokeObjectURL(url);
              showToast("Exported complete history.", "success");
            } catch(e) {
              showToast("Error processing export data: " + e.message, "error");
            }
          })
          .withFailureHandler(err => {
            btn.disabled = false;
            btn.innerHTML = originalText;
            showToast("Export failed: " + err.message, "error");
          })
          .exportAllAbsenceRequests(window.activeUserEmail);
      }

        const mainContent = document.getElementById('mainContent');

            const adminTabs = ['btn-generalSettingsTab', 'btn-bellScheduleTab', 'btn-staffRosterTab', 'btn-auditLogsTab', 'btn-dataManagementTab'];
            adminTabs.forEach(id => {

            });
        }
        const adminView = document.getElementById('adminDashboardView');
        const hrView = document.getElementById('hrDashboardView');
        const atAGlanceView = document.getElementById('atAGlanceDashboardView');
        const settingsView = document.getElementById('settingsDashboardView');

        if (settingsView.classList.contains('hidden')) {
          mainContent.classList.add('hidden');
          if (adminView) adminView.classList.add('hidden');
          if (hrView) hrView.classList.add('hidden');
          if (atAGlanceView) atAGlanceView.classList.add('hidden');
          settingsView.classList.remove('hidden');

          // load Settings Data

             loadSettingsData();

             if (typeof loadPayPeriodsSettings === 'function') {

            loadStaffRosterSettings();

          if (userRole === 'hr') {
            switchSettingsTab('hrSettingsTab');
          } else {
            switchSettingsTab('generalSettingsTab');
          }
          const today = new Date();
          const offset = today.getTimezoneOffset() * 60000;
          const localISOTime = (new Date(today - offset)).toISOString().split('T')[0];
          const pastDate = new Date(today - offset);
          pastDate.setDate(pastDate.getDate() - 7);
          const pastISOTime = pastDate.toISOString().split('T')[0];

          if (!document.getElementById('auditStartDate').value) document.getElementById('auditStartDate').value = pastISOTime;
          if (!document.getElementById('auditEndDate').value) document.getElementById('auditEndDate').value = localISOTime;

      function changeBellScheduleMonth(delta) {

      function handleBellScheduleDayClick(dateStr) {
        const prevColor = bellScheduleDates[dateStr] || '';
        let nextColor = '';

        if (currentBellScheduleBrush === 'cycle') {
          const cycleOrder = ['Green', 'Blue', 'Gold', 'Red', ''];
          const idx = cycleOrder.indexOf(prevColor);
          nextColor = cycleOrder[(idx + 1) % cycleOrder.length];
        } else {
          // If clicking with the same color brush, toggle it off; otherwise paint the selected color
          nextColor = (prevColor === currentBellScheduleBrush) ? '' : currentBellScheduleBrush;
        }

        if (nextColor) {
          bellScheduleDates[dateStr] = nextColor;
        } else {
          delete bellScheduleDates[dateStr];
        }
        syncGlobalDateColors(bellScheduleDates);
        renderBellScheduleCalendar();

        google.script.run
          .withSuccessHandler(res => {
            if (!res || !res.success) {
              showToast("Failed to save date color: " + (res ? res.error : "Unknown error"), "error");
              if (prevColor) bellScheduleDates[dateStr] = prevColor;
              else delete bellScheduleDates[dateStr];
              syncGlobalDateColors(bellScheduleDates);
              renderBellScheduleCalendar();
            }
          })
          .withFailureHandler(err => {
            showToast("Failed to save date color: " + err.message, "error");
            if (prevColor) bellScheduleDates[dateStr] = prevColor;
            else delete bellScheduleDates[dateStr];
            syncGlobalDateColors(bellScheduleDates);
            renderBellScheduleCalendar();
          })
          .saveBellScheduleDateAdmin(dateStr, nextColor, window.activeUserEmail);
      }

      function renderBellScheduleCalendar() {
        const grid = document.getElementById('bellScheduleCalendarGrid');
        const label = document.getElementById('bellScheduleMonthLabel');
        if (!grid || !label) return;

        const year = currentBellScheduleMonth.getFullYear();
        const month = currentBellScheduleMonth.getMonth();
        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        label.innerText = `${monthNames[month]} ${year}`;

        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        const startingDayOfWeek = firstDay.getDay();
        const totalDays = lastDay.getDate();

        let html = '';

        for (let i = 0; i < startingDayOfWeek; i++) {
          html += `<div class="p-4 border rounded-lg bg-gray-50 border-gray-100 opacity-50"></div>`;
        }

        for (let day = 1; day <= totalDays; day++) {
          const currentDate = new Date(year, month, day);
          const dayOfWeek = currentDate.getDay();
          const mm = String(month + 1).padStart(2, '0');
          const dd = String(day).padStart(2, '0');
          const stdDateStr = `${year}-${mm}-${dd}`;

          const color = bellScheduleDates[stdDateStr] || '';
          const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);

          let cellClasses = "bg-white border-gray-200 hover:bg-gray-50 text-gray-700";
          let badgeText = isWeekend ? "Weekend" : "Unset";
          let badgeClasses = "text-gray-400 font-normal";

          if (color === 'Green') {
            cellClasses = "bg-green-100 border-green-500 text-green-900 hover:bg-green-200";
            badgeText = "Green";
            badgeClasses = "text-green-800 font-bold";
          } else if (color === 'Blue') {
            cellClasses = "bg-blue-100 border-blue-400 text-blue-900 hover:bg-blue-200";
            badgeText = "Blue";
            badgeClasses = "text-blue-800 font-bold";
          } else if (color === 'Gold') {
            cellClasses = "bg-yellow-100 border-yellow-400 text-yellow-900 hover:bg-yellow-200";
            badgeText = "Gold";
            badgeClasses = "text-yellow-800 font-bold";
          } else if (color === 'Red') {
            cellClasses = "bg-red-100 border-red-400 text-red-900 hover:bg-red-200";
            badgeText = "Red";
            badgeClasses = "text-red-800 font-bold";
          } else if (color) {
            cellClasses = "bg-purple-100 border-purple-400 text-purple-900 hover:bg-purple-200";
            badgeText = color;
            badgeClasses = "text-purple-800 font-bold";
          } else if (isWeekend) {
            cellClasses = "bg-gray-50 border-gray-200 text-gray-400 hover:bg-gray-100";
          }

          html += `
            <div onclick="handleBellScheduleDayClick('${escapeJs(stdDateStr)}')" class="p-3 sm:p-5 border rounded-lg cursor-pointer transition-colors relative flex items-center justify-center select-none ${cellClasses}">
              <span class="absolute top-1 left-2 text-xs sm:text-sm font-bold">${day}</span>
              <span class="text-xs mt-3 ${badgeClasses}">${escapeHtml(badgeText)}</span>
            </div>
          `;
        }

        grid.innerHTML = html;
      }

      function processBellScheduleCsvUpload() {
        const fileInput = document.getElementById('bellScheduleCsvFileInput');
        const textarea = document.getElementById('bellScheduleCsvTextarea');

        if (fileInput && fileInput.files.length > 0) {
          const file = fileInput.files[0];
          const reader = new FileReader();
          reader.onload = function(e) {
            parseAndSubmitBellScheduleCsv(e.target.result);
            fileInput.value = "";
          };
          reader.readAsText(file);
        } else if (textarea && textarea.value.trim() !== "") {
          parseAndSubmitBellScheduleCsv(textarea.value);
          textarea.value = "";
        } else {
          showToast("Please select a CSV file or paste CSV/TSV data.", "error");
        }
      }

      function parseAndSubmitBellScheduleCsv(csvText) {
        const lines = csvText.split(/\r?\n/).filter(line => line.trim() !== '');
        if (lines.length === 0) {
          showToast("Data is empty.", "info");
          return;
        }

        let delimiter = ',';
        if (lines[0].includes('\t')) {
          delimiter = '\t';
        }

        const firstLine = parseCsvLine(lines[0], delimiter);
        const firstLineUpper = firstLine.map(s => s.toUpperCase().trim());
        const hasHeaders = firstLineUpper.includes('DATE') || firstLineUpper.includes('COLOR') || firstLineUpper.includes('DAY TYPE') || firstLineUpper.includes('DAY');
        const startIndex = hasHeaders ? 1 : 0;

        if (lines.length <= startIndex) {
          showToast("Data contains no schedule rows.", "info");
          return;
        }

        const updates = [];
        for (let i = startIndex; i < lines.length; i++) {
          const row = parseCsvLine(lines[i], delimiter);
          if (row.length < 2) continue;
          const dateVal = row[0].replace(/^"|"$/g, '').trim();
          const colorVal = row[1].replace(/^"|"$/g, '').trim();
          if (dateVal && colorVal) {
            updates.push({ date: dateVal, color: colorVal });
          }
        }

        if (updates.length === 0) {
          showToast("No valid rows found. Make sure each row has Date and Color.", "error");
          return;
        }

        const replaceAllEl = document.getElementById('bellScheduleReplaceAllCheckbox');
        const replaceAll = replaceAllEl ? replaceAllEl.checked : false;
        const modeDesc = replaceAll ? "REPLACE all existing bell schedule dates with" : "merge/update";

        showConfirm(`Are you sure you want to ${modeDesc} ${updates.length} bell schedule date(s)?`, () => {
          const btn = document.getElementById('btnProcessBellScheduleCsv');
          const origText = btn ? btn.innerText : "Process Bell Schedule";
          if (btn) {
            btn.disabled = true;
            btn.innerText = "Processing...";
          }

          google.script.run
            .withSuccessHandler(result => {
              if (btn) {
                btn.disabled = false;
                btn.innerText = origText;
              }
              if (result && result.success) {
                showToast(`Processed ${result.updated} bell schedule date(s).`, "success");
                if (result.dateColors) {
                  syncGlobalDateColors(result.dateColors);
                  renderBellScheduleCalendar();
                } else {
                  loadBellScheduleSettings();
                }
              } else {
                showToast("Failed to process bell schedule: " + (result ? result.error : "Unknown error"), "error");
              }
            })
            .withFailureHandler(err => {
              if (btn) {
                btn.disabled = false;
                btn.innerText = origText;
              }
              showToast("Connection Error: " + err.message, "error");
            })
            .bulkUpsertBellScheduleDates(updates, replaceAll, window.activeUserEmail);
        });
      }

        link.setAttribute('href', url);
        link.setAttribute('download', 'Bell_Schedule_Dates.csv');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        showToast("Exported Bell_Schedule_Dates.csv", "success");
      }

      function loadEmailQueueStatus() {
        const tbody = document.getElementById('emailQueueTableBody');
        if (tbody) {
          tbody.innerHTML = '<tr><td colspan="4" class="p-6 text-center text-gray-400 italic">Loading email queue...</td></tr>';
        }
        google.script.run
          .withSuccessHandler(statusObj => {
            renderEmailQueueStatus(statusObj);
          })
          .withFailureHandler(err => {
            if (tbody) {
              tbody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-red-600 font-bold">Failed to load email queue: ${escapeHtml(err.message)}</td></tr>`;

      function renderEmailQueueStatus(statusObj) {
        const pendingBadge = document.getElementById('emailQueuePendingBadge');
        const failedBadge = document.getElementById('emailQueueFailedBadge');
        const tbody = document.getElementById('emailQueueTableBody');

        const pendingCount = (statusObj && typeof statusObj.pendingCount === 'number') ? statusObj.pendingCount : 0;
        const failedCount = (statusObj && typeof statusObj.failedCount === 'number') ? statusObj.failedCount : 0;
        const items = (statusObj && Array.isArray(statusObj.items)) ? statusObj.items : [];

        if (pendingBadge) pendingBadge.innerText = pendingCount;
        if (failedBadge) failedBadge.innerText = failedCount;
        if (!tbody) return;

        if (items.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" class="p-6 text-center text-gray-400 italic">Email queue is empty — no pending or failed emails.</td></tr>';
          return;
        }

        let html = '';
        items.forEach(item => {
          const isFailed = String(item.status || '').indexOf('Failed') === 0;
          const badgeClass = isFailed
            ? 'bg-red-100 text-red-800 border-red-200'
            : 'bg-blue-100 text-blue-800 border-blue-200';
          html += `
            <tr class="hover:bg-gray-50 transition-colors border-b border-gray-100 last:border-b-0">
              <td class="p-2.5 text-xs text-gray-600 whitespace-nowrap">${escapeHtml(item.timestamp)}</td>
              <td class="p-2.5 text-xs font-medium text-gray-800">${escapeHtml(item.to)}</td>
              <td class="p-2.5 text-xs text-gray-700 max-w-xs truncate" title="${escapeHtml(item.subject)}">${escapeHtml(item.subject)}</td>
              <td class="p-2.5 text-xs">
                <span class="inline-block px-2 py-0.5 rounded border font-semibold ${badgeClass}">${escapeHtml(item.status)}</span>
              </td>
            </tr>
          `;
        });
        tbody.innerHTML = html;
      }
