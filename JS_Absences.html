<script>
      function toggleSubAvailabilityOnBehalfModal(show) {
        const modal = document.getElementById('subAvailabilityOnBehalfModal');
        const body = document.querySelector('body');

        if (show) {
            modal.classList.remove('opacity-0');
            modal.classList.remove('pointer-events-none');
            body.classList.add('overflow-hidden');

            // Reset state
            document.getElementById('onBehalfSub').value = "";
            document.getElementById('onBehalfSubCalendarSection').classList.add('hidden');
            document.getElementById('onBehalfSubLoading').classList.add('hidden');
            onBehalfSubAvailabilityData = {};

            // Set calendar month to current
            currentOnBehalfSubAvailabilityMonth = new Date();
            currentOnBehalfSubAvailabilityMonth.setDate(1);
        } else {
            modal.classList.add('opacity-0');
            modal.classList.add('pointer-events-none');
            body.classList.remove('overflow-hidden');
        }
      }

      function toggleModal(isEdit = false, absId = null, isOnBehalf = false) {
        const body = document.querySelector('body');
        const modal = document.querySelector('#modal');
        const overlay = document.querySelector('#genericModalOverlay');

        if (modal.classList.contains('opacity-0')) {
          // Opening
          modal.classList.remove('opacity-0');
          modal.classList.remove('pointer-events-none');
          overlay.classList.remove('opacity-0');
          overlay.classList.remove('pointer-events-none');
          body.classList.add('overflow-hidden');

          if (!isEdit) {
             if(window.absDatePicker) {
                 window.absDatePicker.set("mode", "multiple");
                 window.absDatePicker.clear();
             }
             document.getElementById("singleDatePeriodsBlock").classList.remove("hidden");
             document.getElementById("multiDatePeriodsContainer").classList.add("hidden");
             document.getElementById("multiDatePeriodsContainer").innerHTML = "";
             document.getElementById('requestModalTitle').innerText = isOnBehalf ? "Request Sub for Teacher" : "Request Sub";
             document.getElementById('absenceForm').reset();
             document.getElementById('editAbsenceId').value = "";
             document.getElementById('submitBtn').innerText = "Submit Request";
             setUrgency('Standard');
             checkSpecialReason();
             document.getElementById('adminDeleteBtn').classList.add('hidden');

             // Uncheck all periods and clear time hints
             document.querySelectorAll('.period-cb').forEach(cb => cb.checked = false);
             renderPeriodCheckboxTimeHints(document.getElementById('singleDatePeriodsBlock'), '.period-cb', '');

             if (isOnBehalf) {
               document.getElementById('onBehalfSection').classList.remove('hidden');
               document.getElementById('onBehalfTeacher').required = true;
             } else {
               document.getElementById('onBehalfSection').classList.add('hidden');
               document.getElementById('onBehalfTeacher').required = false;
               document.getElementById('onBehalfTeacher').value = "";
             }
          } else {
             if(window.absDatePicker) {
                 window.absDatePicker.set("mode", "single");
             }
             document.getElementById("singleDatePeriodsBlock").classList.remove("hidden");
             document.getElementById("multiDatePeriodsContainer").classList.add("hidden");
             document.getElementById("multiDatePeriodsContainer").innerHTML = "";
             document.getElementById('onBehalfSection').classList.add('hidden');
             document.getElementById('onBehalfTeacher').required = false;
             document.getElementById('onBehalfTeacher').value = "";
          }
          // Delay slightly to let inputs initialize if needed
          setTimeout(captureModalState, 50);
        } else {
          // Closing
          modal.classList.add('opacity-0');
          modal.classList.add('pointer-events-none');
          overlay.classList.add('opacity-0');
          overlay.classList.add('pointer-events-none');
          body.classList.remove('overflow-hidden');
        }
      }

      function handleAbsDateChangeMulti(selectedDates) {
          const singleBlock = document.getElementById("singleDatePeriodsBlock");
          const multiContainer = document.getElementById("multiDatePeriodsContainer");
          const maxDays = parseInt(document.getElementById("settingsMaxMultiDays")?.value || "5", 10);

          if (selectedDates.length > maxDays) {
              showToast("Maximum of " + maxDays + " days can be selected at once.", "warning");
              window.absDatePicker.setDate(selectedDates.slice(0, maxDays));
              return;
          }

          if (selectedDates.length <= 1) {
              singleBlock.classList.remove("hidden");
              multiContainer.classList.add("hidden");
              multiContainer.innerHTML = "";
              if (selectedDates.length === 1) {
                  const dateStr = window.absDatePicker.formatDate(selectedDates[0], "Y-m-d");
                  updatePeriodsForSingleDate(dateStr, document.getElementById("absDuration").value);
              } else {
                  document.getElementById("dayColorBadge").classList.add("hidden");
              }
              return;
          }

          // Multiple dates selected
          singleBlock.classList.add("hidden");
          multiContainer.classList.remove("hidden");
          multiContainer.innerHTML = "";

          const duration = document.getElementById("absDuration").value;

          selectedDates.sort((a,b) => a - b).forEach(date => {
              const dateStr = window.absDatePicker.formatDate(date, "Y-m-d");
              const blockId = "multi_periods_" + dateStr;

              // Create a block for each date
              const block = document.createElement("div");
              block.className = "border rounded-lg p-3 bg-gray-50";
              block.innerHTML = `
                  <div class="font-bold text-sm mb-2 flex justify-between">
                     <span>${date.toLocaleDateString("en-US", {weekday: "short", month: "short", day: "numeric"})}</span>
                     <span id="badge_${dateStr}" class="text-xs px-2 py-1 rounded border"></span>
                  </div>
                  <div class="grid grid-cols-5 gap-2" id="${blockId}">
                    <label class="flex items-center gap-2 p-1 border rounded cursor-pointer hover:bg-white bg-white text-sm"><input type="checkbox" value="1" class="multi-period-cb h-3 w-3"> 1</label>
                    <label class="flex items-center gap-2 p-1 border rounded cursor-pointer hover:bg-white bg-white text-sm"><input type="checkbox" value="2" class="multi-period-cb h-3 w-3"> 2</label>
                    <label class="flex items-center gap-2 p-1 border rounded cursor-pointer hover:bg-white bg-white text-sm"><input type="checkbox" value="3" class="multi-period-cb h-3 w-3"> 3</label>
                    <label class="flex items-center gap-2 p-1 border rounded cursor-pointer hover:bg-white bg-white text-sm"><input type="checkbox" value="4" class="multi-period-cb h-3 w-3"> 4</label>
                    <label class="flex items-center gap-2 p-1 border rounded cursor-pointer hover:bg-white bg-white text-sm"><input type="checkbox" value="5" class="multi-period-cb h-3 w-3"> 5</label>
                    <label class="flex items-center gap-2 p-1 border rounded cursor-pointer hover:bg-white bg-white text-sm"><input type="checkbox" value="6" class="multi-period-cb h-3 w-3"> 6</label>
                    <label class="flex items-center gap-2 p-1 border rounded cursor-pointer hover:bg-white bg-white text-sm"><input type="checkbox" value="7" class="multi-period-cb h-3 w-3"> 7</label>
                    <label class="flex items-center gap-2 p-1 border rounded cursor-pointer hover:bg-white bg-white text-sm"><input type="checkbox" value="8" class="multi-period-cb h-3 w-3"> 8</label>
                    <label class="flex items-center gap-2 p-1 border rounded cursor-pointer hover:bg-white bg-white text-sm"><input type="checkbox" value="0" class="multi-period-cb h-3 w-3"> 0</label>
                    <label class="flex items-center gap-2 p-1 border rounded cursor-pointer hover:bg-white bg-white text-sm"><input type="checkbox" value="10" class="multi-period-cb h-3 w-3"> Adv</label>
                  </div>
              `;
              multiContainer.appendChild(block);
              updatePeriodsForMultiDateBlock(dateStr, duration, blockId, "badge_" + dateStr);
          });
      }

      function handleOnBehalfTeacherChange() {
          if (window.absDatePicker && window.absDatePicker.selectedDates.length > 0) {
              // It's multi-date or single date
              if (window.absDatePicker.config.mode === 'multiple' && window.absDatePicker.selectedDates.length > 1) {
                  handleAbsDateChangeMulti(window.absDatePicker.selectedDates);
              } else {
                  const dateStr = document.getElementById('absDate').value;
                  const duration = document.getElementById('absDuration').value;
                  updatePeriodsForSingleDate(dateStr, duration);
              }
          } else {
              const dateStr = document.getElementById('absDate').value;
              const duration = document.getElementById('absDuration').value;
              updatePeriodsForSingleDate(dateStr, duration);
          }
      }
      function updatePeriodsForSingleDate(dateStr, duration) {
          if (!dateStr) {
              document.getElementById("dayColorBadge").classList.add("hidden");
              return;
          }

          let color = userDateColors[dateStr] || 'Red';
          const badge = document.getElementById('dayColorBadge');
          badge.classList.remove('hidden');
          badge.innerText = color + ' Day';
          badge.className = "ml-2 text-xs font-bold px-2 py-1 rounded border " +
                          (color === "Green" ? "bg-green-100 text-green-800 border-green-300" :
                           color === "Blue" ? "bg-blue-100 text-blue-800 border-blue-300" :
                           color === "Gold" ? "bg-yellow-100 text-yellow-800 border-yellow-300" : "bg-gray-100 text-gray-800 border-gray-300");

          let activePeriods = [];

          if (color === "Green") {
              if (duration === "Full Day") activePeriods = [1, 2, 3, 4, 5, 6, 7, 8];
              else if (duration === "Half Day (AM)" || duration === "Half Day") activePeriods = [1, 2, 3, 4];
              else if (duration === "Half Day (PM)") activePeriods = [5, 6, 7, 8];
          } else if (color === "Blue") {
              if (duration === "Full Day") activePeriods = [1, 2, 3, 4];
              else if (duration === "Half Day (AM)" || duration === "Half Day") activePeriods = [1, 2];
              else if (duration === "Half Day (PM)") activePeriods = [3, 4];
          } else if (color === "Gold") {
              if (duration === "Full Day") activePeriods = [5, 6, 7, 8];
              else if (duration === "Half Day (AM)" || duration === "Half Day") activePeriods = [5, 6];
              else if (duration === "Half Day (PM)") activePeriods = [7, 8];
          }

          let finalPeriods = [];
          let scheduleToUse = getActiveTeacherSchedule(dateStr);
          if (scheduleToUse && scheduleToUse.length > 0) {
              activePeriods.forEach(ap => {
                  // scheduleToUse may contain strings ('9' for 0, '10' for Advisory, or ints)
                  // So we should convert everything to string to check properly, but activePeriods
                  // contains ints from the color logic (e.g. [1,2,3,4]).
                  if (scheduleToUse.includes(ap) || scheduleToUse.includes(String(ap))) {
                      finalPeriods.push(String(ap));
                  }
              });
          }

          document.querySelectorAll("#singleDatePeriodsBlock .period-cb").forEach(cb => {
              cb.checked = finalPeriods.includes(cb.value);
          });
          renderPeriodCheckboxTimeHints(document.getElementById("singleDatePeriodsBlock"), ".period-cb", dateStr);
      }

      function renderPeriodCheckboxTimeHints(containerEl, cbSelector, dateStr) {
          if (!containerEl) return;
          const scheduleToUse = dateStr ? getActiveTeacherSchedule(dateStr) : [];
          const dayColor = dateStr ? (userDateColors[dateStr] || '') : '';
          const meetingPeriods = typeof getMeetingPeriodsForDayColor === 'function' ? getMeetingPeriodsForDayColor(dayColor) : [];

          containerEl.querySelectorAll(cbSelector).forEach(cb => {
              const label = cb.closest("label");
              if (!label) return;
              const pVal = String(cb.value);
              const isTeaching = scheduleToUse && (scheduleToUse.includes(pVal) || scheduleToUse.includes(parseInt(pVal, 10)));
              const meetsToday = meetingPeriods.length === 0 || meetingPeriods.includes(pVal);

              // Style label according to teacher's teaching schedule and whether period meets on dayColor
              label.className = "flex items-center space-x-2 text-sm px-2 py-1.5 rounded-lg border transition-all cursor-pointer select-none " +
                  (isTeaching && meetsToday
                      ? "border-[#00843D] bg-green-50/60 text-[#002147] font-semibold shadow-[0_0_0_1px_rgba(0,132,61,0.15)]"
                      : (!meetsToday
                          ? "border-gray-200 bg-gray-100/70 text-gray-400 opacity-50"
                          : "border-gray-200 bg-white text-gray-700 hover:bg-gray-50"));

              let teachBadge = label.querySelector(".period-teaching-dot");
              if (isTeaching) {
                  if (!teachBadge) {
                      teachBadge = document.createElement("span");
                      teachBadge.className = "period-teaching-dot inline-block w-1.5 h-1.5 rounded-full bg-[#00843D] ml-1 shrink-0";
                      teachBadge.title = "You teach this period";
                      label.appendChild(teachBadge);
                  }
              } else if (teachBadge) {
                  teachBadge.remove();
              }

              let hintEl = label.querySelector(".period-time-hint");
              const tr = dateStr ? getClientPeriodTimeRange(dateStr, cb.value) : null;
              if (tr && tr.displayRange) {
                  if (!hintEl) {
                      hintEl = document.createElement("span");
                      hintEl.className = "period-time-hint text-[10px] text-gray-500 font-normal ml-0.5";
                      label.appendChild(hintEl);
                  }
                  hintEl.innerText = `(${tr.displayRange})`;
              } else if (hintEl) {
                  hintEl.remove();
              }
          });
      }

      function updatePeriodsForMultiDateBlock(dateStr, duration, blockId, badgeId) {
          if (!dateStr) return;
          let color = userDateColors[dateStr] || 'Red';
          const badge = document.getElementById(badgeId);
          if(badge) {
              badge.innerText = color + " Day";
              badge.className = "text-xs px-2 py-1 rounded border " +
                              (color === "Green" ? "bg-green-100 text-green-800 border-green-300" :
                               color === "Blue" ? "bg-blue-100 text-blue-800 border-blue-300" :
                               color === "Gold" ? "bg-yellow-100 text-yellow-800 border-yellow-300" : "bg-gray-100 text-gray-800 border-gray-300");
          }

          let activePeriods = [];

          if (color === "Green") {
              if (duration === "Full Day") activePeriods = [1, 2, 3, 4, 5, 6, 7, 8];
              else if (duration === "Half Day (AM)" || duration === "Half Day") activePeriods = [1, 2, 3, 4];
              else if (duration === "Half Day (PM)") activePeriods = [5, 6, 7, 8];
          } else if (color === "Blue") {
              if (duration === "Full Day") activePeriods = [1, 2, 3, 4];
              else if (duration === "Half Day (AM)" || duration === "Half Day") activePeriods = [1, 2];
              else if (duration === "Half Day (PM)") activePeriods = [3, 4];
          } else if (color === "Gold") {
              if (duration === "Full Day") activePeriods = [5, 6, 7, 8];
              else if (duration === "Half Day (AM)" || duration === "Half Day") activePeriods = [5, 6];
              else if (duration === "Half Day (PM)") activePeriods = [7, 8];
          }

          let finalPeriods = [];
          let scheduleToUse = getActiveTeacherSchedule(dateStr);
          if (scheduleToUse && scheduleToUse.length > 0) {
              activePeriods.forEach(ap => {
                  // scheduleToUse may contain strings ('9' for 0, '10' for Advisory, or ints)
                  // So we should convert everything to string to check properly, but activePeriods
                  // contains ints from the color logic (e.g. [1,2,3,4]).
                  if (scheduleToUse.includes(ap) || scheduleToUse.includes(String(ap))) {
                      finalPeriods.push(String(ap));
                  }
              });
          }

          const blockContainer = document.getElementById(blockId);
          if(blockContainer) {
              blockContainer.querySelectorAll(".multi-period-cb").forEach(cb => {
                  cb.checked = finalPeriods.includes(cb.value);
              });
              renderPeriodCheckboxTimeHints(blockContainer, ".multi-period-cb", dateStr);
          }
      }


      function checkSpecialReason() {
        const select = document.getElementById('absReason');
        const hrSection = document.getElementById('hrSection');
        const principalSection = document.getElementById('principalSection');

        let hrRequired = false;
        let principalRequired = false;
        if (select.options.length > 0 && select.selectedIndex > -1) {
            let hrAttr = select.options[select.selectedIndex].getAttribute('data-hr-required');
            let prAttr = select.options[select.selectedIndex].getAttribute('data-principal-required');
            hrRequired = (String(hrAttr).trim().toLowerCase() === 'true');
            principalRequired = (String(prAttr).trim().toLowerCase() === 'true');
        }

        if (hrRequired) {
          hrSection.classList.remove('hidden');
        } else {
          hrSection.classList.add('hidden');
        }

        if (principalRequired) {
          principalSection.classList.remove('hidden');
        } else {
          principalSection.classList.add('hidden');
        }
      }

      function setUrgency(val) {
        document.getElementById('urgencyValue').value = val;
        const s = document.getElementById('btnStd');
        const u = document.getElementById('btnUrg');
        if (val === 'Standard') {
          s.className = "flex-1 py-2 rounded-lg border-2 border-[#00843D] bg-[#00843D] text-white font-bold transition-colors";
          u.className = "flex-1 py-2 rounded-lg border-2 border-gray-200 text-gray-500 font-bold transition-colors";
        } else {
          u.className = "flex-1 py-2 rounded-lg border-2 border-red-600 bg-red-600 text-white font-bold transition-colors";
          s.className = "flex-1 py-2 rounded-lg border-2 border-gray-200 text-gray-500 font-bold transition-colors";
        }
      }


      let todaysAbsencesData = [];
      let todaysAbsencesFilterMode = 'all'; // 'all' | 'open' | 'free'
      let todaysAbsencesViewMode = (typeof window !== 'undefined' && window.innerWidth < 640) ? 'cards' : 'grid'; // 'grid' | 'cards'

      function getFilteredTodaysAbsences(rawRecords) {
          if (!rawRecords || !Array.isArray(rawRecords)) return [];
          const todayDateRef = (rawRecords[0] && (rawRecords[0].formDateString || rawRecords[0].date)) || new Date().toISOString().slice(0, 10);
          const teacherSchedule = getActiveTeacherSchedule(todayDateRef).map(String);

          return rawRecords.filter(req => {
              const isOpen = !req.assignedSub || req.assignedSub.trim() === '';
              if (todaysAbsencesFilterMode === 'open') {
                  return isOpen;
              }
              if (todaysAbsencesFilterMode === 'free') {
                  const pStr = String(req.period);
                  const isTeacherBusy = teacherSchedule.includes(pStr);
                  return isOpen && !isTeacherBusy;
              }
              return true;
          });
      }

      function updateTodaysAbsencesToolbarUI() {
          const filterModes = ['all', 'open', 'free'];
          const btnIds = {
              all: 'btnTodaysFilterAll',
              open: 'btnTodaysFilterOpen',
              free: 'btnTodaysFilterFree'
          };
          filterModes.forEach(m => {
              const btn = document.getElementById(btnIds[m]);
              if (!btn) return;
              if (m === 'free' && currentUserRole === 'substitute') {
                  btn.classList.add('hidden');
              } else {
                  btn.classList.remove('hidden');
              }
              if (todaysAbsencesFilterMode === m) {
                  btn.className = "px-2.5 py-1 text-xs font-bold rounded-md bg-white text-[#002147] shadow-sm transition-all";
              } else {
                  btn.className = "px-2.5 py-1 text-xs font-bold rounded-md text-gray-600 hover:text-[#002147] transition-all";
              }
          });

          const btnGrid = document.getElementById('btnTodaysViewGrid');
          const btnCards = document.getElementById('btnTodaysViewCards');
          if (btnGrid && btnCards) {
              if (todaysAbsencesViewMode === 'grid') {
                  btnGrid.className = "px-2.5 py-1 text-xs font-bold rounded-md bg-white text-[#002147] shadow-sm transition-all";
                  btnCards.className = "px-2.5 py-1 text-xs font-bold rounded-md text-gray-600 hover:text-[#002147] transition-all";
              } else {
                  btnCards.className = "px-2.5 py-1 text-xs font-bold rounded-md bg-white text-[#002147] shadow-sm transition-all";
                  btnGrid.className = "px-2.5 py-1 text-xs font-bold rounded-md text-gray-600 hover:text-[#002147] transition-all";
              }
          }
      }

      function setTodaysAbsencesFilter(mode) {
          todaysAbsencesFilterMode = mode || 'all';
          updateTodaysAbsencesToolbarUI();
          renderTodaysAbsences(todaysAbsencesData);
      }

      function setTodaysAbsencesViewMode(mode) {
          todaysAbsencesViewMode = mode || 'grid';
          updateTodaysAbsencesToolbarUI();
          const container = document.getElementById('todaysAbsences');
          const gridContainer = document.getElementById('todaysAbsencesGridContainer');
          if (!todaysAbsencesData || todaysAbsencesData.length === 0) return;
          if (todaysAbsencesViewMode === 'grid') {
              if (gridContainer) gridContainer.classList.remove('hidden');
              if (container) container.classList.add('hidden');
          } else {
              if (gridContainer) gridContainer.classList.add('hidden');
              if (container) container.classList.remove('hidden');
          }
      }

      function renderTodaysAbsencesGrid(records) {
        const thead = document.getElementById('todaysAbsencesGridTableHeader');
        const tbody = document.getElementById('todaysAbsencesGridTableBody');

        if (!records || records.length === 0) {
            thead.innerHTML = '<tr class="bg-gray-50 border-b border-gray-300 text-sm text-gray-700 uppercase"><th class="p-3 border border-gray-300 sticky left-0 z-20 bg-gray-50">Teacher Name</th></tr>';
            const emptyMsg = todaysAbsencesFilterMode === 'free'
                ? 'No open sub periods match your free periods today.'
                : (todaysAbsencesFilterMode === 'open' ? 'All periods for today are covered!' : 'No absences found for today.');
            tbody.innerHTML = `<tr><td class="p-8 text-center text-gray-400 italic border border-gray-300">${escapeHtml(emptyMsg)}</td></tr>`;
            return;
        }

        // 1. Group records by teacher
        const teacherMap = {};
        const activePeriods = new Set();

        records.forEach(req => {
            if (!teacherMap[req.teacherName]) {
                teacherMap[req.teacherName] = {
                    name: req.teacherName,
                    periods: {}
                };
            }

            teacherMap[req.teacherName].periods[req.period] = {
                assignedSub: req.assignedSub || null,
                room: req.room || "N/A",
                req: req
            };
            activePeriods.add(req.period.toString());
        });

        const hasPeriod1 = activePeriods.has('1');
        const advisorySortValue = hasPeriod1 ? 1.5 : 5.5;

        const sortedActivePeriods = Array.from(activePeriods).sort((a, b) => {
            const valA = String(a) === '10' ? advisorySortValue : parseInt(a);
            const valB = String(b) === '10' ? advisorySortValue : parseInt(b);
            return valA - valB;
        });

        // 2. Build Header (with Free / Teaching badges for teachers)
        const todayDateRef = (records[0] && (records[0].formDateString || records[0].date)) || new Date().toISOString().slice(0, 10);
        const mySchedule = getActiveTeacherSchedule(todayDateRef).map(String);
        const showTeacherFreeBadge = currentUserRole !== 'substitute' && mySchedule.length > 0;

        let headerHtml = `<th class="p-3 border border-gray-300 min-w-[200px] sticky left-0 z-20 bg-gray-50 shadow-[1px_0_0_0_#d1d5db]">Teacher Name</th>`;
        sortedActivePeriods.forEach(p => {
            const isTeachingThisPeriod = mySchedule.includes(String(p));
            const statusPillHtml = showTeacherFreeBadge
                ? (isTeachingThisPeriod
                    ? `<div class="mt-1"><span class="inline-block text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-200 text-slate-700 normal-case">Teaching</span></div>`
                    : `<div class="mt-1"><span class="inline-block text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-300 normal-case">✓ You're Free</span></div>`)
                : '';
            headerHtml += `<th class="p-3 border border-gray-300 text-center w-64">${formatPeriodLabel(p, todayDateRef)}${statusPillHtml}</th>`;
        });
        thead.innerHTML = headerHtml;

        // 3. Build Body
        let html = '';
        const teachers = Object.values(teacherMap).sort((a, b) => a.name.localeCompare(b.name));

        teachers.forEach(t => {
            html += `<tr class="hover:bg-gray-50 transition-colors group">`;
            html += `<td class="p-3 text-sm text-gray-800 font-bold border border-gray-300 sticky left-0 z-10 bg-white group-hover:bg-gray-50 shadow-[1px_0_0_0_#d1d5db]">${escapeHtml(t.name)}</td>`;

            sortedActivePeriods.forEach(p => {
                const pData = t.periods[p];
                if (pData) {
                    const req = pData.req;
                    const assignId = 'btn_assign_todays_' + req.id + '_' + req.period;

                    if (pData.assignedSub && pData.assignedSub.trim() !== '' && pData.assignedSub !== 'No Sub Needed') {
                        html += `<td class="p-3 text-xs text-center border border-gray-300 bg-green-50 align-top">
                                    <div class="font-bold text-[#00843D]">${escapeHtml(pData.assignedSub)}</div>
                                    <div class="text-gray-600 mt-1">${escapeHtml(pData.room)}</div>
                                 </td>`;
                    } else if (pData.assignedSub === 'No Sub Needed') {
                        html += `<td class="p-3 text-xs text-center border border-gray-300 bg-gray-100 align-top">
                                    <div class="font-bold text-gray-600">No Sub Needed</div>
                                    <div class="text-gray-500 mt-1">${escapeHtml(pData.room)}</div>
                                 </td>`;
                    } else {
                        html += `<td class="p-3 text-xs text-center border border-gray-300 bg-yellow-50 align-top"
                                     onclick="document.getElementById('${assignId}').click()" class="cursor-pointer">

      function handleSignMeUp(absenceId, period, btnId, teacherName, courseName) {
        let confirmMsg = "Are you sure you want to cover this period?";
        if (teacherName && courseName) {
            confirmMsg = `Are you sure you want to cover ${formatPeriodLabel(period)}, ${escapeHtml(courseName)}, for ${escapeHtml(teacherName)}?`;
        }

        showConfirm(confirmMsg, () => {
        const btn = document.getElementById(btnId);
        const originalText = btn.innerText;
        btn.disabled = true;
        btn.innerText = "Assigning...";

        // Get user name loaded in initApp
        const subName = document.getElementById('userName').innerText;

        if (!subName || subName === "Loading...") {
          showToast("Error: User name not fully loaded yet. Please try again in a moment.", "error");
          btn.disabled = false;
          btn.innerText = originalText;
          return;
        }

        google.script.run
          .withSuccessHandler(result => {
            if (result && result.success) {
              showToast("Successfully signed up for period " + period + "!", "success");
              // Refresh all relevant sections
              EventBus.publish('refresh_todaysAbsences');
              EventBus.publish('refresh_mySubDuties');

              if (!document.getElementById('adminSection').classList.contains('hidden')) {
                 EventBus.publish('refresh_quickCover');
                 EventBus.publish('refresh_adminData');
              }
            } else {
              showToast(result ? result.error : "Unknown error", 'error');
              btn.disabled = false;
              btn.innerText = originalText;

              if (result && result.error && (result.error.includes('filled by someone else') || result.error.includes('server is currently busy'))) {
                  loadTodaysAbsences();
              }
            }
          })
          .withFailureHandler(err => {
            if (err.message && err.message.includes('AVAILABILITY_ERROR')) {
              let parsedErr;
              try { parsedErr = JSON.parse(err.message.replace(/^Error: /, '')); } catch(e) { parsedErr = {message: 'Sub not listed as available, proceed?'}; }
              showConfirm(parsedErr.message || 'Sub not listed as available, proceed?', () => {
                 btn.innerText = 'Forcing...';
                 google.script.run
                    .withSuccessHandler(result => {
                       if (result && result.success) {
                          showToast("Successfully signed up for " + formatPeriodLabel(period) + "!", "success");
                          EventBus.publish('refresh_todaysAbsences');
                          EventBus.publish('refresh_mySubDuties');
                          if (!document.getElementById('adminSection').classList.contains('hidden')) {
                             EventBus.publish('refresh_quickCover');
                             EventBus.publish('refresh_adminData');
                          }
                       } else {
                          showToast(result ? result.error : "Unknown error", 'error');
                          btn.disabled = false;
                          btn.innerText = originalText;
                       }
                    })
                    .withFailureHandler(forceErr => {
                       showToast("Connection error: " + forceErr.message, 'error');
                       btn.disabled = false;
                       btn.innerText = originalText;
                    })
                    .assignSubToPeriod(absenceId, period, subName, true, window.activeUserEmail);
              }, () => {
                 btn.disabled = false;
                 btn.innerText = originalText;
              });
            } else {
              showToast("Connection error: " + err.message, 'error');
              btn.disabled = false;
              btn.innerText = originalText;
            }
          })
          .assignSubToPeriod(absenceId, period, subName, false, window.activeUserEmail);
        });
      }

      function updateDynamicStaffList(dateStr, period) {
          const datalist = document.getElementById('dynamicStaffDataList');
          if (!datalist) return;

          // Find all subs currently busy at this exact date and period
          const busySubs = new Set();
          adminDataRaw.forEach(req => {
              if (req.formDateString === dateStr && String(req.period) === String(period)) {
                  if (req.assignedSub) {
                      busySubs.add(req.assignedSub.trim().toLowerCase());
                  }
              }
          });

          const p = parseInt(period);
          let dayColor = globalDateColors[dateStr] || "Green";

          // Build HTML for subs who are NOT busy
          let optionsHtml = '';
          staffList.forEach(staff => {
              if (busySubs.has(staff.name.trim().toLowerCase())) return;

              // Filter Substitutes by availability for this date
              if (staff.role === 'substitute') {
                  const avail = staff.availability ? staff.availability[dateStr] : null;
                  if (avail !== "Available" && avail !== "AM Only" && avail !== "PM Only") {
                      return; // Skip this substitute, they are not available
                  }

                  if (avail === 'AM Only') {
                      if (dayColor === 'Green' && p > 4) return;
                      if (dayColor === 'Blue' && p > 2) return;
                      if (dayColor === 'Gold' && p > 6) return;
                  }
                  if (avail === 'PM Only') {
                      if (dayColor === 'Green' && p <= 4) return;
                      if (dayColor === 'Blue' && p <= 2) return;
                      if (dayColor === 'Gold' && p <= 6) return;
                  }
              }

              let suggestionText = staff.name;
              if (staff.role === 'substitute') {
                  suggestionText += " - s";
              }
              if (staff.duty) {
                  suggestionText += " - " + staff.duty;
              }
              optionsHtml += `<option value="${escapeHtml(suggestionText)}"></option>`;
          });

          datalist.innerHTML = optionsHtml;
      }

      function getNextSchoolDays(numDays) {
        const days = [];
        let current = new Date();
        current.setHours(12, 0, 0, 0); // Noon to avoid timezone issues

        while (days.length < numDays) {
            const dayOfWeek = current.getDay();
            if (dayOfWeek !== 0 && dayOfWeek !== 6) { // Skip Sunday (0) and Saturday (6)
                const yyyy = current.getFullYear();
                const mm = String(current.getMonth() + 1).padStart(2, '0');
                const dd = String(current.getDate()).padStart(2, '0');
                days.push({
                    dateStr: `${yyyy}-${mm}-${dd}`,
                    dateObj: new Date(current.getTime())
                });
            }
            current.setDate(current.getDate() + 1);
        }
        return days;
      }

      function handleAssign(absenceId, period, selectElementId, isFromModal = false) {
        const selectEl = document.getElementById(selectElementId);
        let subName = selectEl.value;

        // Strip out duty suffix if present: "Name - Duty" -> "Name"
        if (subName) {
           subName = subName.replace(/\s+-\s+.*$/, '');
        }

        // Normalize "No Sub Needed"
        if (subName && subName.toLowerCase() === "no sub needed") {
            subName = "No Sub Needed";
        }

        if (subName && subName !== "No Sub Needed" && !staffList.some(s => s.name === subName)) {
          showToast("Please enter a valid staff name from the list, or leave it blank to clear.", 'error');
          return;
        }

        const btn = selectEl.nextElementSibling;
        const originalText = btn.innerText;
        btn.disabled = true;
        btn.innerText = "Saving...";

        google.script.run
          .withSuccessHandler(result => {
            if (result && result.success) {
              if (subName) {
                 showToast('Sub assigned successfully!', 'success');
              } else {
                 showToast('Sub Removed Successfully', 'success');
              }

              if (isFromModal) {
                 closeDetailsModal();
              }
              EventBus.publish('refresh_quickCover');
              updateLocalAdminData(absenceId, period, subName);
            } else {
              showToast(result ? result.error : "Unknown error", 'error');
              btn.disabled = false;
              btn.innerText = originalText;

              if (result && result.error && (result.error.includes('filled by someone else') || result.error.includes('server is currently busy'))) {
                  loadTodaysAbsences();
              }
            }
          })
          .withFailureHandler(err => {
            if (err.message && err.message.includes('AVAILABILITY_ERROR')) {
              let parsedErr;
              try { parsedErr = JSON.parse(err.message.replace(/^Error: /, '')); } catch(e) { parsedErr = {message: 'Sub not listed as available, proceed?'}; }
              showConfirm(parsedErr.message || 'Sub not listed as available, proceed?', () => {
                 btn.innerText = 'Forcing...';
                 google.script.run
                    .withSuccessHandler(result => {
                       if (result && result.success) {
                          if (subName) {
                             showToast('Sub assigned successfully!', 'success');
                          } else {
                             showToast('Sub Removed Successfully', 'success');
                          }
                          if (isFromModal) {
                             closeAllModals();
                          }
                          EventBus.publish('refresh_quickCover');
                          updateLocalAdminData(absenceId, period, subName);
                       }
                    })
                    .withFailureHandler(forceErr => {
                       showToast("Connection error: " + forceErr.message, 'error');
                       btn.disabled = false;
                       btn.innerText = originalText;
                    })
                    .assignSubToPeriod(absenceId, period, subName, true, window.activeUserEmail);
              }, () => {
                 btn.disabled = false;
                 btn.innerText = originalText;
              });
            } else {
              showToast("Connection error: " + err.message, 'error');
              btn.disabled = false;
              btn.innerText = originalText;
            }
          })
          .assignSubToPeriod(absenceId, period, subName, false, window.activeUserEmail);
      }

      function getCalendarAllDayRangeStrings(dateStr, fallbackDateStr) {
        let iso = String(dateStr || '').trim();
        if (!/^\d{4}-\d{2}-\d{2}$/.test(iso) && fallbackDateStr) {
          const parsed = new Date(fallbackDateStr);
          if (!isNaN(parsed.getTime())) {
            const yyyy = parsed.getFullYear();
            const mm = String(parsed.getMonth() + 1).padStart(2, '0');
            const dd = String(parsed.getDate()).padStart(2, '0');
            iso = `${yyyy}-${mm}-${dd}`;
          }
        }
        if (!/^\d{4}-\d{2}-\d{2}$/.test(iso)) {
          return { iso: '', startYMD: '', endYMD: '' };
        }
        const [y, m, d] = iso.split('-').map(Number);
        const startUtc = new Date(Date.UTC(y, m - 1, d));
        const endUtc = new Date(Date.UTC(y, m - 1, d + 1));
        const fmt = dt =>
          String(dt.getUTCFullYear()) +
          String(dt.getUTCMonth() + 1).padStart(2, '0') +
          String(dt.getUTCDate()).padStart(2, '0');
        return { iso, startYMD: fmt(startUtc), endYMD: fmt(endUtc) };
      }

      function buildSubDutyCalendarEvent(duty) {
        const range = getCalendarAllDayRangeStrings(duty.formDateString, duty.date);
        const periodTime = range.iso ? getClientPeriodTimeRange(range.iso, duty.period) : null;
        const dayColor = (range.iso && typeof userDateColors === 'object' && userDateColors[range.iso])
          ? `${userDateColors[range.iso]} Day`
          : '';
        const periodLabel = formatPeriodLabel(duty.period);
        const timeRangeLabel = periodTime ? ` (${periodTime.startTime} - ${periodTime.endTime})` : '';
        const hasRealCourse = duty.course && duty.course !== 'No Class Assigned';
        const hasRealRoom = duty.room && duty.room !== 'No Class Assigned';

        const title = `Sub Coverage: ${periodLabel} - ${duty.teacherName}${hasRealCourse ? ' (' + duty.course + ')' : ''}`;
        const location = hasRealRoom ? `Room ${duty.room} - Cathedral High School` : 'Cathedral High School';
        const detailsLines = [
          `Teacher: ${duty.teacherName}${duty.teacherEmail ? ' (' + duty.teacherEmail + ')' : ''}`,
          `Date: ${duty.date}${dayColor ? ' (' + dayColor + ')' : ''}`,
          `Period: ${periodLabel}${timeRangeLabel}`,
          `Room: ${duty.room || 'N/A'}`,
          `Course: ${duty.course || 'N/A'}`,
          `Special Instructions: ${duty.instructions || 'None provided'}`,
          duty.subPlanUrl ? `Sub Plan: ${duty.subPlanUrl}` : '',
          `Take Attendance: https://powerschool.cathedral-irish.org/subs/pw.html`
        ].filter(Boolean);

        return {
          title,
          location,
          description: detailsLines.join('\n'),
          startYMD: range.startYMD,
          endYMD: range.endYMD,
          startLocalStr: periodTime ? periodTime.startLocalStr : '',
          endLocalStr: periodTime ? periodTime.endLocalStr : '',
          uid: `subduty-${duty.id || 'req'}-p${duty.period || '0'}@cathedral-sub-app`
        };
      }

      function openGoogleCalendarTemplateUrl(ev) {
        if (!ev) return;
        let datesParam = '';
        if (ev.startLocalStr && ev.endLocalStr) {
          datesParam = `&dates=${ev.startLocalStr}/${ev.endLocalStr}`;
        } else if (ev.startYMD && ev.endYMD) {
          datesParam = `&dates=${ev.startYMD}/${ev.endYMD}`;
        }
        const url = `https://calendar.google.com/calendar/render?action=TEMPLATE` +
          `&text=${encodeURIComponent(ev.title)}` +
          datesParam +
          `&location=${encodeURIComponent(ev.location || '')}` +
          `&details=${encodeURIComponent(ev.description || '')}`;
        window.open(url, '_blank', 'noopener,noreferrer');
      }

      function escapeIcsText(str) {
        return String(str || '')
          .replace(/\\/g, '\\\\')
          .replace(/;/g, '\\;')
          .replace(/,/g, '\\,')
          .replace(/\r?\n/g, '\\n');
      }

      function downloadCalendarIcsFile(ev, filename) {
        const hasTimed = Boolean(ev && ev.startLocalStr && ev.endLocalStr);
        const hasAllDay = Boolean(ev && ev.startYMD && ev.endYMD);
        if (!hasTimed && !hasAllDay) {
          showToast('Unable to determine event date for calendar file.', 'error');
          return;
        }
        const nowUtc = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
        const dtStartLine = hasTimed ? `DTSTART:${ev.startLocalStr}` : `DTSTART;VALUE=DATE:${ev.startYMD}`;
        const dtEndLine = hasTimed ? `DTEND:${ev.endLocalStr}` : `DTEND;VALUE=DATE:${ev.endYMD}`;
        const icsLines = [
          'BEGIN:VCALENDAR',
          'VERSION:2.0',
          'PRODID:-\/\/Cathedral High School\/\/Cathedral Sub App\/\/EN',
          'CALSCALE:GREGORIAN',
          'METHOD:PUBLISH',
          'BEGIN:VEVENT',
          `UID:${ev.uid || ('event-' + nowUtc + '@cathedral-sub-app')}`,
          `DTSTAMP:${nowUtc}`,
          dtStartLine,
          dtEndLine,
          `SUMMARY:${escapeIcsText(ev.title)}`,
          `LOCATION:${escapeIcsText(ev.location)}`,
          `DESCRIPTION:${escapeIcsText(ev.description)}`,
          'END:VEVENT',
          'END:VCALENDAR'
        ];
        const blob = new Blob([icsLines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        link.setAttribute('href', url);
        link.setAttribute('download', filename || 'Sub_Duty.ics');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      }

      function buildAbsencePeriodStatusChips(abs) {
            if (!abs || !abs.periodsWithSubs) {
              return { chipsHtml: '', summaryBadgeHtml: '' };
            }
            const dateStr = abs.formDateString || abs.date;
            const rawParts = String(abs.periodsWithSubs).split(/,(?![^(]*\))/).map(s => s.trim()).filter(Boolean);
            let neededCount = 0;
            let coveredCount = 0;
            const chips = [];

            rawParts.forEach(part => {
              const m = part.match(/^(Advisory|\d+)\s*(?:\((.*)\))?$/i);
              if (!m) {
                chips.push(`<span class="inline-flex items-center gap-1 text-xs font-semibold px-2.5 py-1 rounded-lg bg-gray-100 text-gray-700 border border-gray-200">${escapeHtml(part)}</span>`);
                return;
              }
              const pToken = m[1];
              const subStatus = (m[2] || 'Not Yet Assigned').trim();
              const subStatusLower = subStatus.toLowerCase();
              const tr = getClientPeriodTimeRange(dateStr, pToken);
              const shortPeriodName = (String(pToken).toLowerCase() === 'advisory' || String(pToken) === '10')
                ? 'Advisory'
                : (String(pToken) === '9' ? 'Pd 0' : `Pd ${pToken}`);
              const timeStr = (tr && tr.displayRange) ? ` (${tr.displayRange})` : '';

              const isUnassigned = !subStatus
                || subStatusLower === 'unassigned'
                || subStatusLower === 'not yet assigned'
                || subStatusLower === 'awaiting sub'
                || subStatusLower === 'open';

              if (subStatusLower === 'no sub needed') {
                chips.push(`<span class="inline-flex items-center gap-1 text-xs font-semibold px-2.5 py-1 rounded-lg bg-gray-100 text-gray-600 border border-gray-200" title="No substitute required for this period"><span>⚪</span><span>${escapeHtml(shortPeriodName + timeStr)} • No Sub Needed</span></span>`);
              } else if (isUnassigned) {
                neededCount++;
                chips.push(`<span class="inline-flex items-center gap-1 text-xs font-bold px-2.5 py-1 rounded-lg bg-amber-50 text-amber-800 border border-amber-300" title="Awaiting substitute assignment"><span>⏳</span><span>${escapeHtml(shortPeriodName + timeStr)} • Awaiting Sub</span></span>`);
              } else {
                neededCount++;
                coveredCount++;
                chips.push(`<span class="inline-flex items-center gap-1 text-xs font-bold px-2.5 py-1 rounded-lg bg-green-50 text-[#00843D] border border-green-300" title="Covered by ${escapeHtml(subStatus)}"><span>✓</span><span>${escapeHtml(shortPeriodName + timeStr)} • ${escapeHtml(subStatus)}</span></span>`);
              }
            });

            let summaryBadgeHtml = '';
            if (neededCount > 0) {
              if (coveredCount === neededCount) {
                summaryBadgeHtml = `<span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-green-100 text-[#00843D] border border-green-300">✓ Fully Covered (${coveredCount}/${neededCount})</span>`;
              } else if (coveredCount > 0) {
                summaryBadgeHtml = `<span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 border border-amber-300">${coveredCount}/${neededCount} Covered</span>`;
              } else {
                summaryBadgeHtml = `<span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 border border-amber-300">0/${neededCount} Covered</span>`;
              }
            } else if (rawParts.length > 0) {
              summaryBadgeHtml = `<span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-gray-100 text-gray-600 border border-gray-300">No Sub Needed</span>`;
            }

            return {
              chipsHtml: chips.join(''),
              summaryBadgeHtml: summaryBadgeHtml
            };
          }

              if (i < val) {
                  stars[i].classList.remove('text-gray-300');

      function editAbsence(index) {
        const abs = myAbsencesData[index];
        if (!abs) return;

        document.getElementById('requestModalTitle').innerText = "Edit Request";
        document.getElementById('editAbsenceId').value = abs.id;
        document.getElementById('submitBtn').innerText = "Save Changes";

        // Date format handling
        let targetDate = "";
        if (abs.formDateString) {
           targetDate = abs.formDateString;
        } else {
           let d = new Date(abs.rawDateString);
           let year = d.getFullYear();
           let month = String(d.getMonth() + 1).padStart(2, '0');
           let day = String(d.getDate()).padStart(2, '0');
           targetDate = `${year}-${month}-${day}`;
        }
        document.getElementById('absDate').value = targetDate;
        if(window.absDatePicker) {
            window.absDatePicker.setDate(targetDate);
        }

        document.getElementById('absDuration').value = abs.duration || "Full Day";

        let pArr = (abs.periods || "").split(",").map(p => {
           const trimmed = p.trim();
           return (trimmed.toLowerCase() === 'advisory' || trimmed.toLowerCase() === 'a') ? '10' : trimmed;
        });
        document.querySelectorAll('.period-cb').forEach(cb => {
           cb.checked = pArr.includes(cb.value);
        });

        document.getElementById('absReason').value = abs.reason;
        checkSpecialReason();

        setUrgency(abs.urgency === 'Urgent' ? 'Urgent' : 'Standard');

        // Remove HR prefix if present
        let inst = abs.instructions || "";
        let hrConfirmed = false;
        if (inst.startsWith("[HR Docs Provided] ")) {
           hrConfirmed = true;
           inst = inst.replace("[HR Docs Provided] ", "");
        }
        document.getElementById('specialInst').value = inst;

        document.getElementById('subPlanUrlInput').value = abs.subPlanUrl || "";

        if (hrConfirmed && !document.getElementById('hrSection').classList.contains('hidden')) {
           document.getElementById('hrConfirm').checked = true;
        } else {
           document.getElementById('hrConfirm').checked = false;
        }

        document.getElementById('agreement').checked = true; // Pre-check for convenience on edit

        document.getElementById('adminDeleteBtn').classList.add('hidden'); // Regular users don't see delete in the modal, they use the cancel button on the list
        toggleModal(true);
        setTimeout(captureModalState, 50);
      }

         document.getElementById('requestModalTitle').innerText = "Edit Request (Admin)";
         document.getElementById('editAbsenceId').value = req.id;
         document.getElementById('submitBtn').innerText = "Save Changes";
         document.getElementById('adminDeleteBtn').classList.remove('hidden');

         // Handle date
         let targetDate = "";
         if (req.formDateString) {
             targetDate = req.formDateString;
         } else {
             targetDate = req.date;
         }
         document.getElementById('absDate').value = targetDate;
         if(window.absDatePicker) {
            window.absDatePicker.setDate(targetDate);
         }

         document.getElementById('absDuration').value = req.duration || "Full Day";

         let pArr = (req.periodsString || "").split(",").map(p => {
            const trimmed = p.trim();
            return (trimmed.toLowerCase() === 'advisory' || trimmed.toLowerCase() === 'a') ? '10' : trimmed;
         });
         document.querySelectorAll('.period-cb').forEach(cb => {
            cb.checked = pArr.includes(cb.value);
         });

         document.getElementById('absReason').value = req.reason;
         checkSpecialReason();

         setUrgency(req.urgency.includes('Urgent') ? 'Urgent' : 'Standard');

         // Parse instructions for HR confirmation flag
         let inst = req.instructions || "";
         let hrConfirmed = false;
         if (inst.startsWith("[HR Docs Provided] ")) {
            hrConfirmed = true;
            inst = inst.replace("[HR Docs Provided] ", "");
         }
         document.getElementById('specialInst').value = inst;

         document.getElementById('subPlanUrlInput').value = req.subPlanUrl || "";

         if (hrConfirmed && !document.getElementById('hrSection').classList.contains('hidden')) {
            document.getElementById('hrConfirm').checked = true;
         } else {
            document.getElementById('hrConfirm').checked = false;
         }

         document.getElementById('agreement').checked = true;

         toggleModal(true);
         setTimeout(captureModalState, 50);
      }

      function deleteAbsenceFromModal() {
         const id = document.getElementById('editAbsenceId').value;
         if (!id) return;

         showConfirm("Are you sure you want to completely delete this absence request? The teacher will be notified.", () => {
         const btn = document.getElementById('adminDeleteBtn');
         const originalText = btn.innerText;
         btn.disabled = true;
         btn.innerText = "Deleting...";

         google.script.run
           .withSuccessHandler(result => {
              if (result && result.success) {
                showToast("Request cancelled successfully.", 'success');
                toggleModal(); // close modal
                if (!document.getElementById('adminSection').classList.contains('hidden')) {
                  EventBus.publish('refresh_quickCover');
                  EventBus.publish('refresh_adminData');
                }
              } else {
                showToast("Failed to cancel: " + (result ? result.error : "Unknown"), "error");
                btn.disabled = false;
              btn.innerText = originalText;

              if (result && result.error && (result.error.includes('filled by someone else') || result.error.includes('server is currently busy'))) {
                  loadTodaysAbsences();
              }
            }
          })
          .withFailureHandler(err => {
              showToast("Error: " + err.message, 'error');
              btn.disabled = false;
              btn.innerText = originalText;
           })
           .cancelAbsence(id, window.activeUserEmail);
         });
      }

      function cancelAbsence(id) {
        showConfirm("Are you sure you want to cancel this request? Any assigned substitutes will be automatically notified.", () => {
        const container = document.getElementById('myAbsences');
        container.innerHTML = '<div class="w-6 h-6 rounded-full border-[3px] border-gray-100 border-t-[#00843D] animate-spin mx-auto my-4"></div>';

        google.script.run
          .withSuccessHandler(result => {
             if (result && result.success) {
               showToast("Request cancelled successfully.", 'success');
               EventBus.publish('refresh_myAbsences');
               if (!document.getElementById('adminSection').classList.contains('hidden')) {
                 EventBus.publish('refresh_quickCover');
                 EventBus.publish('refresh_adminData');
               }
             } else {
               showToast("Failed to cancel: " + (result ? result.error : "Unknown"), "error");
               loadMyAbsences();
             }
          })
          .withFailureHandler(err => {
             showToast("Error: " + err.message, 'error');
             loadMyAbsences();
          })
          .cancelAbsence(id, window.activeUserEmail);
        });
      }

      document.getElementById('absenceForm').onsubmit = function(e) {
        e.preventDefault();

        const editId = document.getElementById('editAbsenceId').value;
        const isMulti = window.absDatePicker && window.absDatePicker.selectedDates.length > 1;

        let requests = [];

        const reasonSelect = document.getElementById('absReason');
        const reason = reasonSelect.value;
        const hrChecked = document.getElementById('hrConfirm').checked;
        const agreed = document.getElementById('agreement').checked;
        const duration = document.getElementById('absDuration').value;
        const urgency = document.getElementById('urgencyValue').value;
        const specialInstructions = document.getElementById('specialInst').value;
        const subPlanUrl = document.getElementById('subPlanUrlInput').value;

        const isHidden = document.getElementById('onBehalfSection').classList.contains('hidden');
        const onBehalfTeacherName = isHidden ? null : document.getElementById('onBehalfTeacher').value;

        if (!isHidden && !onBehalfTeacherName) {
           showToast("Please enter the teacher's name.", 'error');
           return;
        }

        let hrRequired = false;
        if (reasonSelect.options.length > 0 && reasonSelect.selectedIndex > -1) {
            hrRequired = reasonSelect.options[reasonSelect.selectedIndex].getAttribute('data-hr-required') === 'true';
        }

        if (hrRequired && !hrChecked) {
          showToast("Please confirm HR documentation has been provided.", 'error');
          return;
        }
        if (!agreed) {
          showToast("You must agree to the terms to submit.", 'info');
          return;
        }

        if (isMulti && !editId) {
            for (const date of window.absDatePicker.selectedDates) {
                const dateStr = window.absDatePicker.formatDate(date, "Y-m-d");
                const blockId = "multi_periods_" + dateStr;
                const blockContainer = document.getElementById(blockId);

                let selectedPeriods = "";
                if (blockContainer) {
                    selectedPeriods = Array.from(blockContainer.querySelectorAll('.multi-period-cb:checked'))
                                         .map(cb => cb.value).join(', ');
                }

                if (!selectedPeriods) {
                    selectedPeriods = "None";
                }

                requests.push({
                    date: dateStr,
                    duration: duration,
                    periods: selectedPeriods,
                    reason: reason,
                    urgency: urgency,
                    specialInstructions: specialInstructions,
                    subPlanUrl: subPlanUrl,
                    hrConfirmed: hrChecked,
                    onBehalfTeacher: onBehalfTeacherName
                });
            }
        } else {
            let selectedPeriods = Array.from(document.querySelectorAll('#singleDatePeriodsBlock .period-cb:checked'))
                                         .map(cb => cb.value).join(', ');

            if (!selectedPeriods) {
                selectedPeriods = "None";
            }

            const newDateVal = document.getElementById('absDate').value;

            requests.push({
                date: newDateVal,
                duration: duration,
                periods: selectedPeriods,
                reason: reason,
                urgency: urgency,
                specialInstructions: specialInstructions,
                subPlanUrl: subPlanUrl,
                hrConfirmed: hrChecked,
                onBehalfTeacher: onBehalfTeacherName
            });
        }

        // Duplicate Request Check
        if (!editId) {
            for (const req of requests) {
                const duplicateIndex = myAbsencesData.findIndex(abs => {
                    let existingDate = "";
                    if (abs.formDateString) {
                      existingDate = abs.formDateString;
                    } else {
                      let d = new Date(abs.rawDateString);
                      let year = d.getFullYear();
                      let month = String(d.getMonth() + 1).padStart(2, '0');
                      let day = String(d.getDate()).padStart(2, '0');
                      existingDate = `${year}-${month}-${day}`;
                    }
                    return existingDate === req.date;
                });

                if (duplicateIndex !== -1) {
                    showDuplicateWarning(duplicateIndex);
                    return;
                }
            }
        }

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerHTML = '<div class="flex items-center justify-center gap-2"><div class="w-6 h-6 rounded-full border-[3px] border-gray-100 border-t-[#00843D] animate-spin"></div> Sending...</div>';

        if (editId) {
          google.script.run
            .withSuccessHandler((result) => {
              if (result && result.success) {
                showToast("Request Updated Successfully!", 'success');
                btn.disabled = false;
                btn.innerHTML = 'Save Changes';
                originalModalData = {};
                toggleModal();
                loadMyAbsences();
                if (!document.getElementById('adminSection').classList.contains('hidden')) {
                  EventBus.publish('refresh_quickCover');
                  EventBus.publish('refresh_adminData');
                }
              } else {
                showToast(result ? result.error : "Database Error", 'error');
                btn.disabled = false;
                btn.innerHTML = 'Save Changes';
              }
            })
            .withFailureHandler(err => {
              showToast("Connection Error: " + err.message, 'error');
              btn.disabled = false;
              btn.innerHTML = 'Save Changes';
            })
            .updateAbsence(editId, requests[0], window.activeUserEmail);
        } else if (requests.length > 1) {
          google.script.run
            .withSuccessHandler((result) => {
              if (result && result.success) {
                showToast("Requests Submitted Successfully!", 'success');
                document.getElementById('absenceForm').reset();
                setUrgency('Standard');
                document.getElementById('hrSection').classList.add('hidden');
                btn.disabled = false;
                btn.innerHTML = 'Submit Request';
                originalModalData = {};
                toggleModal();
                EventBus.publish('refresh_myAbsences');

                if (!document.getElementById('adminSection').classList.contains('hidden')) {
                  EventBus.publish('refresh_quickCover');
                  EventBus.publish('refresh_adminData');
                }
              } else {
                showToast(result ? result.error : "Database Error", 'error');
                btn.disabled = false;
                btn.innerHTML = 'Submit Request';
              }
            })
            .withFailureHandler(err => {
              showToast("Connection Error: " + err.message, 'error');
              btn.disabled = false;
              btn.innerHTML = 'Submit Request';
            })
            .submitMultipleAbsenceRequests(requests, window.activeUserEmail);
        } else {
          google.script.run
            .withSuccessHandler((result) => {
              if (result && result.success) {
                showToast("Request Submitted Successfully!", 'success');
                document.getElementById('absenceForm').reset();
                setUrgency('Standard');
                document.getElementById('hrSection').classList.add('hidden');
                btn.disabled = false;
                btn.innerHTML = 'Submit Request';
                originalModalData = {};
                toggleModal();
                EventBus.publish('refresh_myAbsences');

                if (!document.getElementById('adminSection').classList.contains('hidden')) {
                  EventBus.publish('refresh_quickCover');
                  EventBus.publish('refresh_adminData');
                }
              } else {
                showToast(result ? result.error : "Database Error", 'error');
                btn.disabled = false;
                btn.innerHTML = 'Submit Request';
              }
            })
            .withFailureHandler(err => {
              showToast("Connection Error: " + err.message, 'error');
              btn.disabled = false;
              btn.innerHTML = 'Submit Request';
            })
            .submitAbsence(requests[0], window.activeUserEmail);
        }
      };

      // Event listener removed as Flatpickr onChange handles it now.
</script>
