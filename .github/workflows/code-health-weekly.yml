name: Weekly Code Health Checkup

on:
  schedule:
    - cron: '0 0 * * 0' # Run every Sunday at midnight
  workflow_dispatch: # Allow manual trigger

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm init -y
          npm install eslint@8.57.1 eslint-plugin-html@8.1.1 --save-dev

      - name: Create ESLint configuration
        run: |
          cat << 'ESLINT' > .eslintrc.json
          {
            "env": {
              "browser": true,
              "es2021": true,
              "node": true
            },
            "extends": "eslint:recommended",
            "plugins": ["html"],
            "parserOptions": {
              "ecmaVersion": 12
            },
            "globals": {
              "google": "readonly",
              "Logger": "readonly",
              "SpreadsheetApp": "readonly",
              "HtmlService": "readonly",
              "PropertiesService": "readonly",
              "Utilities": "readonly",
              "Session": "readonly",
              "LockService": "readonly",
              "CacheService": "readonly",
              "DriveApp": "readonly",
              "GmailApp": "readonly",
              "UrlFetchApp": "readonly",
              "MailApp": "readonly",
              "ScriptApp": "readonly",
              "LanguageApp": "readonly",
              "console": "readonly",
              "Spreadsheet": "readonly",
              "$": "readonly"
            },
            "rules": {
              "no-unused-vars": ["warn", { "varsIgnorePattern": "^(doGet|doPost|getUserData|getInitialPayload|submitAbsence|sendEmailHelper|setupInactivityTracker|reloadApp|escapeHtml|logAuditAction)$" }],
              "no-undef": "warn",
              "no-empty": ["error", { "allowEmptyCatch": true }]
            }
          }
          ESLINT

      - name: Copy .gs files to .js for ESLint
        run: |
          for file in *.gs; do
            cp "$file" "${file%.gs}.js"
          done

      - name: Run ESLint
        run: npx eslint *.js *.html
