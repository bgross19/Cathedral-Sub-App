<script>

      window.activeUserEmail = "";
      
      function reloadApp() {
          if (window.globalAppUrl) {
              window.top.location.href = window.globalAppUrl;
          } else {
              window.top.location.href = window.SCRIPT_SERVICE_URL || '';
          }

      function handleLogout() {
          localStorage.removeItem('subAppEmail');
          reloadApp();
      }
      
      function handleCustomLogin(e) {
          e.preventDefault();
          const emailInput = document.getElementById('loginEmailInput').value.trim().toLowerCase();
          if (!emailInput) return;
          
          const btn = document.getElementById('loginBtn');
          const originalText = btn.innerHTML;
          btn.disabled = true;
          btn.innerHTML = '<span class="inline-block animate-spin mr-2">↻</span> Authenticating...';
          
          // Verify with backend
          google.script.run
              .withSuccessHandler(payload => {
                  if (payload && payload.userData && payload.userData.name) {
                      // Success
                      localStorage.setItem('subAppEmail', emailInput);
                      window.activeUserEmail = emailInput;
                      window.isManualLogin = true;
                      document.getElementById('loginView').classList.add('hidden');
                      finishInitApp(payload);
                  }
              })
              .withFailureHandler(err => {
                  alert("Access Denied: " + err.message);
                  btn.disabled = false;
                  btn.innerHTML = originalText;
              })
              .getInitialPayload(emailInput);
      }

      function parseCsvLine(text, delimiter) {
         const result = [];
         let current = '';
         let inQuotes = false;
         for (let i = 0; i < text.length; i++) {
             const char = text[i];
             if (char === '"') {
                 if (inQuotes && text[i+1] === '"') {
                     current += '"';
                     i++;
                 } else {
                     inQuotes = !inQuotes;
                 }
             } else if (char === delimiter && !inQuotes) {
                 result.push(current);
                 current = '';
             } else {
                 current += char;
             }
         }
         result.push(current);
         return result.map(s => s.trim());
      }

      let userDateColors = {};
      let userTeacherSchedule = [];
      let userTeacherScheduleByTerm = {};

      function resolveClientTermIdForDate(dateStr) {
          const settings = window.appSettings || {};
          const configuredTerm = String(settings["Term ID"] || "3601").trim();
          const centuryMatch = configuredTerm.match(/^(\d{2})\d{2}$/);
          const basePrefix = centuryMatch ? centuryMatch[1] : "36";
          const sem1Term = basePrefix + "01";
          const sem2Term = basePrefix + "03";
          if (!dateStr) return configuredTerm;

          const iso = String(dateStr).trim().substring(0, 10);
          if (!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return configuredTerm;

          const sem2Start = String(settings["Semester 2 Start Date"] || "").trim();
          if (/^\d{4}-\d{2}-\d{2}$/.test(sem2Start)) {
              return iso >= sem2Start ? sem2Term : sem1Term;
          }
          const month = parseInt(iso.substring(5, 7), 10);
          return (month >= 1 && month <= 7) ? sem2Term : sem1Term;
      }

      // Return the schedule to use for pre-selection (date-aware across Semester 1 / Semester 2)
      function getActiveTeacherSchedule(dateStr) {
          const targetTerm = dateStr ? resolveClientTermIdForDate(dateStr) : "";
          const onBehalfSection = document.getElementById('onBehalfSection');
          if (onBehalfSection && !onBehalfSection.classList.contains('hidden')) {
              const onBehalfInput = document.getElementById('onBehalfTeacher');
              if (onBehalfInput) {
                  const selectedName = onBehalfInput.value.trim().toLowerCase();
                  if (selectedName) {
                      const teacher = staffList.find(s => s.name.toLowerCase() === selectedName);
                      if (teacher) {
                          if (targetTerm && teacher.teacherScheduleByTerm && Array.isArray(teacher.teacherScheduleByTerm[targetTerm])) {
                              return teacher.teacherScheduleByTerm[targetTerm];
                          }
                          if (teacher.teacherSchedule) {
                              return teacher.teacherSchedule;
                          }
                      }
                      return []; // If not found, return empty schedule
                  } else {
                      return []; // Empty input, return empty schedule
                  }
              }
          }
          if (targetTerm && userTeacherScheduleByTerm && Array.isArray(userTeacherScheduleByTerm[targetTerm])) {
              return userTeacherScheduleByTerm[targetTerm];
          }
          return userTeacherSchedule;
      }

      let currentAppVersion = "";

      function generateCSVString(tableId) {
        const table = document.getElementById(tableId);
        if (!table) return '';

        let csv = '';

        // Get headers
        const headers = Array.from(table.querySelectorAll(':scope > thead tr.sm\\:table-row th, :scope > thead tr:not(.sm\\:table-row) th'))
                             .map(th => {
                                 let text = th.textContent.trim();
                                 if (/^[=+\-@\t\r]/.test(text)) {
                                     text = "'" + text;
                                 }
                                 return `"${text.replace(/"/g, '""')}"`;
                             });
        if(headers.length > 0) csv += headers.join(',') + '\n';

        // Get rows (only immediate children of tbody to exclude nested sub-tables)
        const tbody = table.querySelector('tbody');
        if (!tbody) return csv;

        const rows = Array.from(tbody.querySelectorAll(':scope > tr'));
        rows.forEach(tr => {
            // Skip details rows for summary export
            if (tr.classList.contains('hr-detail-row')) return;

            const cols = tr.querySelectorAll(':scope > td.sm\\:table-cell, :scope > td:not(.sm\\:hidden):not(.sm\\:table-cell)');
            // Check if this is a loading/empty row (colspan)
            if (cols.length === 1 && cols[0].hasAttribute('colspan')) return;

            const rowData = Array.from(cols).map(td => {
                let text = td.getAttribute('data-export');
                if (!text) {
                    // Extract text but remove the arrow character
                    text = td.textContent.trim().replace(/▼/g, '').replace(/(\r\n|\n|\r)/gm, ' ').trim();
                }
                if (/^[=+\-@\t\r]/.test(text)) {
                    text = "'" + text;
                }
                text = text.replace(/"/g, '""');
                return `"${text}"`;
            });
            if (rowData.length > 0) csv += rowData.join(',') + '\n';
        });

        return csv;
      }

      function exportToCSV(filename, tableId) {
        const csv = generateCSVString(tableId);

        if (csv.trim() === '') {
            showToast('No data to export.', 'info');
            return;
        }

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        link.setAttribute('href', url);
        link.setAttribute('download', filename);
        link.classList.add('invisible');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast(`Exported ${filename}`, 'success');
      }

      // --- PUB-SUB EVENT EMITTER WITH COALESCED REFRESH BATCHING ---
      const EventBus = {
        listeners: {},
        subscribe: function(event, callback) {
          if (!this.listeners[event]) {
            this.listeners[event] = [];
          }
          this.listeners[event].push(callback);
        },
        publish: function(event, data) {
          if (this.listeners[event]) {
            this.listeners[event].forEach(callback => callback(data));
          }
        }
      };

      let _pendingRefreshComponents = new Set();
      let _pendingRefreshRenderAtAGlance = false;
      let _pendingRefreshTimer = null;

      function queueComponentRefresh(component, options = {}) {
        _pendingRefreshComponents.add(component);
        if (options && options.renderAtAGlance) {
          _pendingRefreshRenderAtAGlance = true;
        }
        if (_pendingRefreshTimer) return;
        _pendingRefreshTimer = setTimeout(() => {
          const components = Array.from(_pendingRefreshComponents);
          const renderAtAGlance = _pendingRefreshRenderAtAGlance;
          _pendingRefreshComponents.clear();
          _pendingRefreshRenderAtAGlance = false;
          _pendingRefreshTimer = null;

          if (components.length === 0) return;

          google.script.run
            .withSuccessHandler(res => {
              if (!res) return;
              if (res.myAbsences !== undefined) renderMyAbsences(res.myAbsences);
              if (res.myPastAbsences !== undefined) renderMyPastAbsences(res.myPastAbsences);
              if (res.mySubDuties !== undefined) renderMySubDuties(res.mySubDuties);
              if (res.myPastSubDuties !== undefined) renderMyPastSubDuties(res.myPastSubDuties);
              if (res.todaysAbsences !== undefined) renderTodaysAbsences(res.todaysAbsences);
              if (res.quickCover !== undefined) renderQuickCover(res.quickCover);
              if (res.adminData !== undefined) renderAdminDashboardData(res.adminData, renderAtAGlance);
            })
            .withFailureHandler(err => {
              console.error("Batch refresh failed:", err);
            })
            .refreshData(components, window.activeUserEmail);
        }, 15);
      }

      // Subscribe UI components to coalesced data refresh events
      EventBus.subscribe('refresh_myAbsences', () => queueComponentRefresh('myAbsences'));
      EventBus.subscribe('refresh_myPastAbsences', () => queueComponentRefresh('myPastAbsences'));
      EventBus.subscribe('refresh_mySubDuties', () => queueComponentRefresh('mySubDuties'));
      EventBus.subscribe('refresh_myPastSubDuties', () => queueComponentRefresh('myPastSubDuties'));
      EventBus.subscribe('refresh_todaysAbsences', () => queueComponentRefresh('todaysAbsences'));
      EventBus.subscribe('refresh_quickCover', () => queueComponentRefresh('quickCover'));
      EventBus.subscribe('refresh_adminData', (data) => queueComponentRefresh('adminData', { renderAtAGlance: !!(data && data.renderAtAGlance) }));

      function toggleSection(wrapperId, iconId) {
        const wrapper = document.getElementById(wrapperId);
        const icon = document.getElementById(iconId);

        // Check current state
        const isOpen = wrapper.classList.contains('grid-rows-1');

        if (isOpen) {
          // Close it
          wrapper.classList.remove('grid-rows-1');
          wrapper.classList.add('grid-rows-[0fr]');
          icon.classList.add('-rotate-90');
          localStorage.setItem(`toggle_${wrapperId}`, 'closed');
        } else {
          // Open it
          wrapper.classList.remove('grid-rows-[0fr]');
          wrapper.classList.add('grid-rows-1');
          icon.classList.remove('-rotate-90');
          localStorage.setItem(`toggle_${wrapperId}`, 'open');
        }
      }

      function normalizeClientIsoDate(dateStr) {
        if (!dateStr) return '';
        const raw = String(dateStr).trim();
        if (/^\d{4}-\d{2}-\d{2}/.test(raw)) {
          return raw.substring(0, 10);
        }
        const parsed = new Date(raw);
        if (!isNaN(parsed.getTime())) {
          const yyyy = parsed.getFullYear();
          const mm = String(parsed.getMonth() + 1).padStart(2, '0');
          const dd = String(parsed.getDate()).padStart(2, '0');
          return `${yyyy}-${mm}-${dd}`;
        }
        return '';
      }

      function formatClock12h(hhmm) {
        const m = String(hhmm || '').trim().match(/^(\d{1,2}):(\d{2})$/);
        if (!m) return String(hhmm || '');
        let hr = parseInt(m[1], 10);
        const min = m[2];
        if (hr === 0) hr = 12;
        else if (hr > 12) hr -= 12;
        return `${hr}:${min}`;
      }

      function getClientPeriodTimeRange(dateStr, period) {
        const isoDate = normalizeClientIsoDate(dateStr);
        if (!isoDate) return null;
        const pRaw = String(period !== undefined && period !== null ? period : '').trim().toLowerCase();
        if (!pRaw) return null;
        const pKey = (pRaw === 'advisory' || pRaw === 'adv' || pRaw === 'a') ? '10' : pRaw;

        const colorDict = (typeof userDateColors === 'object' && userDateColors && Object.keys(userDateColors).length > 0)
          ? userDateColors
          : (typeof globalDateColors === 'object' && globalDateColors ? globalDateColors : {});
        const dayColorRaw = colorDict[isoDate] ? String(colorDict[isoDate]).trim() : 'Green';
        const dayColor = (dayColorRaw === 'Blue' || dayColorRaw === 'Gold' || dayColorRaw === 'Green')
          ? dayColorRaw
          : 'Green';

        let timesMap = CLIENT_DEFAULT_PERIOD_BELL_TIMES;
        const rawBellTimes = window.appSettings && window.appSettings['Period Bell Times'];
        if (rawBellTimes) {
          try {
            const parsed = typeof rawBellTimes === 'string' ? JSON.parse(rawBellTimes) : rawBellTimes;
            if (parsed && typeof parsed === 'object') {
              timesMap = Object.assign({}, CLIENT_DEFAULT_PERIOD_BELL_TIMES, parsed);
            }
          } catch (e) {}
        }

        let specificScheduleName = '';
        const rawDateScheduleNames = window.appSettings && window.appSettings['Date Bell Schedule Names'];
        if (rawDateScheduleNames) {
          try {
            const parsedNames = typeof rawDateScheduleNames === 'string' ? JSON.parse(rawDateScheduleNames) : rawDateScheduleNames;
            if (parsedNames && parsedNames[isoDate]) {
              specificScheduleName = String(parsedNames[isoDate]).trim();
            }
          } catch (e2) {}
        }

        const scheduleBucket = (specificScheduleName && timesMap[specificScheduleName])
          ? timesMap[specificScheduleName]
          : (timesMap[dayColor] || CLIENT_DEFAULT_PERIOD_BELL_TIMES[dayColor] || CLIENT_DEFAULT_PERIOD_BELL_TIMES.Green);

        const slot = scheduleBucket[pKey]
          || (pKey === '0' ? scheduleBucket['9'] : null)
          || (pKey === '9' ? scheduleBucket['0'] : null)
          || (timesMap[dayColor] && timesMap[dayColor][pKey])
          || CLIENT_DEFAULT_PERIOD_BELL_TIMES.Green[pKey];
        if (!slot || !slot.start || !slot.end) return null;

        const ymd = isoDate.replace(/-/g, '');
        const displayRange = `${formatClock12h(slot.start)}-${formatClock12h(slot.end)}`;
        return {
          startTime: slot.start,
          endTime: slot.end,
          displayRange: displayRange,
          startLocalStr: `${ymd}T${slot.start.replace(':', '')}00`,
          endLocalStr: `${ymd}T${slot.end.replace(':', '')}00`
        };
      }

      function formatPeriodLabel(period, dateStr) {
        const p = String(period).trim().toLowerCase();
        const baseLabel = (p === '10' || p === 'advisory' || p === 'a') ? 'Advisory' : `Period ${escapeHtml(period)}`;
        if (dateStr) {
          const tr = getClientPeriodTimeRange(dateStr, period);
          if (tr && tr.displayRange) {
            return `${baseLabel} (${escapeHtml(tr.displayRange)})`;
          }
        }
        return baseLabel;
      }

      function formatPeriodValue(period, dateStr) {
        const p = String(period).trim().toLowerCase();
        const baseVal = (p === '10' || p === 'advisory' || p === 'a') ? 'Advisory' : escapeHtml(period);
        if (dateStr) {
          const tr = getClientPeriodTimeRange(dateStr, period);
          if (tr && tr.displayRange) {
            return `${baseVal} (${escapeHtml(tr.displayRange)})`;
          }
        }
        return baseVal;
      }

      function formatPeriodsList(periodsStr, dateStr) {
        if (!periodsStr) return '';
        return String(periodsStr)
          .split(',')
          .map(p => p.trim())
          .filter(p => p !== '')
          .map(p => {
            const lower = p.toLowerCase();
            const label = (lower === '10' || lower === 'advisory' || lower === 'a') ? 'Advisory' : p;
            if (dateStr) {
              const tr = getClientPeriodTimeRange(dateStr, p);
              if (tr && tr.displayRange) {
                return `${label} (${tr.displayRange})`;
              }
            }
            return label;
          })
          .join(', ');
      }

      function formatPeriodsWithSubsAndTimes(abs) {
        if (!abs) return '';
        const dateStr = abs.formDateString || abs.rawDateString || abs.date || '';
        if (!abs.periodsWithSubs) {
          return formatPeriodsList(abs.periods, dateStr);
        }
        return String(abs.periodsWithSubs)
          .split(',')
          .map(part => {
            const trimmed = part.trim();
            const m = trimmed.match(/^(Advisory|\d+)\s*(\(.*\))$/i);
            if (!m) return trimmed;
            const pToken = m[1];
            const subSuffix = m[2];
            const tr = dateStr ? getClientPeriodTimeRange(dateStr, pToken) : null;
            return tr && tr.displayRange ? `${pToken} [${tr.displayRange}] ${subSuffix}` : trimmed;
          })
          .join(', ');
      }

      function escapeJs(str) {
        if (str === null || str === undefined) return '';
        const jsEscaped = String(str)
          .replace(/\\/g, '\\\\')
          .replace(/'/g, "\\'")
          .replace(/"/g, '\\"')
          .replace(/\n/g, '\\n')
          .replace(/\r/g, '\\r');
        return escapeHtml(jsEscaped);
      }

          if (!currentAppVersion) return; // Don't check if we haven't loaded yet

      // --- Inactivity and Stale Data Tracking ---
      let lastActivityTime = Date.now();
      const INACTIVITY_THRESHOLD = 30 * 60 * 1000; // 30 minutes

      function updateActivityTime() {
          lastActivityTime = Date.now();
      }

      function checkStaleData() {
          if (Date.now() - lastActivityTime > INACTIVITY_THRESHOLD) {
              sessionStorage.setItem('staleDataRefreshed', 'true');
              reloadApp();
              updateActivityTime(); // Prevent reload loop while reloading
          }
      }

      function setupInactivityTracker() {
          const events = ['mousedown', 'keydown', 'scroll', 'touchstart']; // Removed mousemove to prevent accidental timer resets
          let throttleTimer = false;
          events.forEach(event => {
              document.addEventListener(event, () => {
                  if(!throttleTimer) {
                      checkStaleData();
                      updateActivityTime();
                      throttleTimer = true;
                      setTimeout(() => { throttleTimer = false; }, 1000);
                  }
              }, { passive: true });
          });

          document.addEventListener('visibilitychange', () => {
              if (document.visibilityState === 'visible') {
                  checkStaleData();
                  updateActivityTime();
              }
          });

          setInterval(() => {
              if (document.visibilityState === 'visible') {
                  checkStaleData();
              }
          }, 60 * 1000); // Check every minute
      }
      // ------------------------------------------

      function scheduleVersionCheck() {
          // Calculate ms until next 6:00 AM
          const now = new Date();
          let next6AM = new Date();
          next6AM.setHours(6, 0, 0, 0);

          if (now >= next6AM) {
              // If it's already past 6 AM today, schedule for 6 AM tomorrow
              next6AM.setDate(next6AM.getDate() + 1);
          }

          const msUntilNext6AM = next6AM.getTime() - now.getTime();

          setTimeout(() => {
              checkAppVersion();
              // After the first check, check every 24 hours
              setInterval(checkAppVersion, 24 * 60 * 60 * 1000);
          }, msUntilNext6AM);
      }

                handleAbsDateChangeMulti(selectedDates);

        scheduleVersionCheck();
        setupInactivityTracker();

        
        let serverEmail = String(window.SERVER_USER_EMAIL || "").trim().toLowerCase();
        let storedEmail = localStorage.getItem('subAppEmail');
        
        window.isManualLogin = false;

        if (sessionStorage.getItem('staleDataRefreshed') === 'true') {
             sessionStorage.removeItem('staleDataRefreshed');
             // Small delay to ensure the DOM is ready for the toast
             setTimeout(() => {
                 showToast("Session refreshed to ensure data is up to date.", "info");
             }, 500);
        }


        if (serverEmail && serverEmail !== "undefined" && serverEmail !== "" && !serverEmail.includes("<" + "?=")) {
             window.activeUserEmail = serverEmail;
             localStorage.setItem('subAppEmail', serverEmail);
        } else if (storedEmail) {
             window.activeUserEmail = storedEmail;
             window.isManualLogin = true;
        }
        
        if (!window.activeUserEmail) {
             // Show login
             document.getElementById('loginView').classList.remove('hidden');
             return;
        }

        // Show loading state if active user is loading
        google.script.run
          .withSuccessHandler(payload => {
              finishInitApp(payload);
          })
          .withFailureHandler(err => {
              console.error("Failed initial payload", err);
              // If it fails with access denied, show login
              if (err.message && err.message.includes("Access Denied")) {
                  localStorage.removeItem('subAppEmail');
                  document.getElementById('loginView').classList.remove('hidden');
              } else {
                  alert("Failed to load app data: " + err.message);
              }
          })
          .getInitialPayload(window.activeUserEmail);
}

function finishInitApp(payload) {
        // Parse URL parameters for "Sign Me Up" links and Deep Links
        google.script.url.getLocation(function(location) {
           if (location.parameter && location.parameter.action === 'quickCover') {
               const absenceId = location.parameter.absenceId;
               const period = location.parameter.period;
               if (absenceId && period) {
                   google.script.run
                     .withSuccessHandler(details => {
                         setTimeout(() => {
                             const dummyBtnId = 'dummy-btn-' + Date.now();
                             const dummyBtn = document.createElement('button');
                             dummyBtn.id = dummyBtnId;
                             dummyBtn.innerText = "Sign Me Up";
                             dummyBtn.classList.add("hidden");
                             document.body.appendChild(dummyBtn);
                             if (details) {
                                 handleSignMeUp(absenceId, period, dummyBtnId, details.teacherName, details.course);
                             } else {
                                 handleSignMeUp(absenceId, period, dummyBtnId);
                             }
                         }, 1500); 
                     })
                     .withFailureHandler(err => {
                         console.error("Failed to fetch absence details for Quick Cover:", err);
                     })
                     .getAbsenceDetails(absenceId, period, undefined, window.activeUserEmail);
               }
           } else if (location.parameter && location.parameter.feedbackAbsenceId) {
               const absenceId = location.parameter.feedbackAbsenceId;
               const feedbackPeriod = location.parameter.feedbackPeriod;

               if (absenceId && feedbackPeriod) {
                   setTimeout(() => {
                       // Make sure section is visible
                       const myPastSubDutiesSection = document.getElementById('myPastSubDutiesSection');
                       if (myPastSubDutiesSection && !myPastSubDutiesSection.classList.contains('hidden')) {
                           toggleSection('myPastSubDutiesWrapper', 'iconMyPastSubDuties', true);
                           openSubFeedbackModal(absenceId, feedbackPeriod);
                       }
                   }, 1000);
               }
           }
        });
        
const data = payload.userData;
            currentAppVersion = data.appVersion;
            document.getElementById('userName').innerText = data.name;
            document.getElementById('userName').dataset.role = data.role;
            document.getElementById('welcomeName').innerText = (data.name.split(',')[1] || data.name).trim();
            
            if (data.appUrl) {
                window.globalAppUrl = data.appUrl;
                const footerLink = document.getElementById('atAGlanceFooterUrl');
                if (footerLink) footerLink.href = data.appUrl;
            }

            try {
               let reasons = JSON.parse(data.absenceReasons || "[]");
               let html = "";
               reasons.forEach(r => {
                 // Store hrRequired property dynamically to be accessed later
                 let hrStr = (r.hrRequired === true || String(r.hrRequired).toLowerCase() === "true") ? "true" : "false";
                 let prStr = (r.principalRequired === true || String(r.principalRequired).toLowerCase() === "true") ? "true" : "false";
                 html += `<option value="${escapeHtml(r.reason)}" data-hr-required="${hrStr}" data-principal-required="${prStr}">${escapeHtml(r.reason)}</option>`;
               });
               if (html === "") {
                 html = `<option value="Personal" data-hr-required="false" data-principal-required="false">Personal</option>`; // Fallback
               }
               document.getElementById('absReason').innerHTML = html;
               checkSpecialReason(); // Call initially to set HR checkbox state
            } catch(e) {
               console.error("Failed to parse absence reasons", e);
               document.getElementById('absReason').innerHTML = `<option value="Personal" data-hr-required="false" data-principal-required="false">Personal</option>`;
            }

            globalDateColors = payload.dateColors || {};
            window.appSettings = payload.settings || {};
            userDateColors = payload.dateColors || {};
            userTeacherSchedule = data.teacherSchedule || [];
            userTeacherScheduleByTerm = data.teacherScheduleByTerm || {};

            // Render common parts (after dateColors and appSettings are initialized so period times resolve)
            renderMyAbsences(payload.myAbsences);
            renderMyPastAbsences(payload.myPastAbsences);
            renderMySubDuties(payload.mySubDuties);
            renderMyPastSubDuties(payload.myPastSubDuties || []);
            renderTodaysAbsences(payload.todaysAbsences);

            let lowerRole = data.role.toLowerCase();

            if (lowerRole === 'substitute') {
               const welcomeDesc = document.getElementById('welcomeDescription');
               if (welcomeDesc) welcomeDesc.innerText = "Review your assignments and upcoming availability below.";
               const newAbsBtn = document.getElementById('newAbsenceBtn');
               if (newAbsBtn) newAbsBtn.classList.add('hidden');
            }

            // Toggle Navigation Buttons and Main Sections using permissions payload
            var perms = payload.permissions || {};
            currentUserPermissions = perms;
            currentUserRole = lowerRole;

            if (perms["Add Request on Behalf"]) {
               document.getElementById('newAbsenceOnBehalfBtn').classList.remove('hidden');
               document.getElementById('newAbsenceOnBehalfBtn').classList.add('flex');
               document.getElementById('newSubAvailabilityOnBehalfBtn').classList.remove('hidden');
               document.getElementById('newSubAvailabilityOnBehalfBtn').classList.add('flex');
            }

            if (perms["Admin Dashboard"] || perms["HR Dashboard"] || perms["Today at a Glance"]) {
               if (payload.staffList) renderStaffList(payload.staffList);
            }

            if (perms["Admin Dashboard"]) {
              document.getElementById('navAdminBtn').classList.remove('hidden');
            }

            if (perms["HR Dashboard"]) {
              document.getElementById('navHRBtn').classList.remove('hidden');
              if (payload.hrData) {
                  hrDataRaw = payload.hrData.requests || [];
                  hrPayPeriods = payload.hrData.payPeriods || [];
                  hrDateColors = payload.dateColors || payload.hrData.dateColors || {};
                  hrRates = payload.hrData.rates || { green: 10, blueGold: 20, special: "[]" };
              }
            }

            if (perms["Today at a Glance"]) {
              document.getElementById('navAtAGlanceBtn').classList.remove('hidden');
            }

            if (perms["Settings"]) {
              document.getElementById('navSettingsBtn').classList.remove('hidden');
            }

            if (window.isManualLogin) {
              const logoutBtns = document.querySelectorAll('#navLogoutBtn');
              logoutBtns.forEach(btn => btn.classList.remove('hidden'));
            }

            if (perms["Admin Dashboard"] || perms["Today's Absences"] || perms["Today at a Glance"]) {
              if (payload.quickCover) {
                  renderQuickCover(payload.quickCover);
              }
            }

            if (perms["Admin Dashboard"] || perms["Today's Absences"]) {
               if (perms["Admin Dashboard"]) document.getElementById('adminSection').classList.remove('hidden');
               if (payload.adminData) {
                  renderAdminDataRawSilent(payload.adminData);
              }
            }

            if (!perms["My Upcoming Sub Duties"]) {
                document.getElementById('headerMySubDuties').classList.add('hidden');
                document.getElementById('mySubDutiesWrapper').classList.add('hidden');
            }
            if (lowerRole === 'substitute') {
                const myAbsHeader = document.getElementById('headerMyAbsences');
                if (myAbsHeader) myAbsHeader.classList.add('hidden');
                const myAbsWrapper = document.getElementById('myAbsencesWrapper');
                if (myAbsWrapper) myAbsWrapper.classList.add('hidden');
                const myOpenJobsHeader = document.getElementById('headerTodaysOpenJobs');
                if (myOpenJobsHeader) myOpenJobsHeader.classList.add('hidden');
                const myOpenJobsWrapper = document.getElementById('todaysAbsencesWrapper');
                if (myOpenJobsWrapper) myOpenJobsWrapper.classList.add('hidden');

                const myAvailSection = document.getElementById('myAvailabilitySection');
                if (myAvailSection) myAvailSection.classList.remove('hidden');

                // Initialize availability calendar
                initAvailabilityCalendar(payload.subAvailability || {});
            }
            if (lowerRole === 'hr' || lowerRole === 'principal') {
              document.getElementById('navHRBtn').classList.remove('hidden');
              if (payload.hrData) {
                  renderHRDashboardData(payload.hrData);
              }
            }
            if (lowerRole === 'hr') {
              toggleHRDashboard();
              // Hide the return to homepage button inside the HR dashboard
              const returnBtn = document.querySelector('#hrDashboardView button[onclick="toggleHRDashboard()"]');
              if (returnBtn) returnBtn.classList.add('hidden');
            }

            if (lowerRole === 'sub coordinator') {
              document.getElementById('subAvailabilitySection').classList.remove('hidden');
              renderSubAvailabilityDashboard();
            }
      }

      function renderStaffList(list) {
            staffList = list;

            // Populate the datalist for "Add Request on Behalf"
            const allStaffDatalist = document.getElementById('allStaffDataList');
            if (allStaffDatalist) {
                let optionsHtml = '';
                staffList.forEach(staff => {
                    optionsHtml += `<option value="${escapeHtml(staff.name)}"></option>`;
                });
                allStaffDatalist.innerHTML = optionsHtml;
            }

            // Populate the datalist for "Add Availability for Sub"
            const allSubsDatalist = document.getElementById('allSubsDataList');
            if (allSubsDatalist) {
                let optionsHtml = '';
                staffList.forEach(staff => {
                    if (staff.role && staff.role.toLowerCase().includes('substitute')) {
                        optionsHtml += `<option value="${escapeHtml(staff.name)}"></option>`;
                    }
                });
                allSubsDatalist.innerHTML = optionsHtml;
            }

            // Rerender Quick Cover in case it loaded before the staff list
            if (typeof currentUnfilledData !== 'undefined' && currentUnfilledData && currentUnfilledData.length > 0) {
               renderQuickCover(currentUnfilledData);
            }
      }

      function loadStaffList() {
        google.script.run
          .withSuccessHandler(res => { if (res.staffList) renderStaffList(res.staffList); })
          .refreshData(['staffList'], window.activeUserEmail);
      }


      // --- MODAL CLOSE AND UNSAVED DATA LOGIC ---
      let originalModalData = {};

      function captureModalState() {
        const isRequestModalOpen = !document.querySelector('#modal').classList.contains('opacity-0');

        const isStaffModalOpen = !document.getElementById('staffModal').classList.contains('opacity-0');

        if (isStaffModalOpen) {
          originalModalData = {
            name: document.getElementById('staffNameInput').value,
            email: document.getElementById('staffEmailInput').value,
            duty: document.getElementById('staffDutyInput').value
          };
        } else if (isRequestModalOpen) {
          const periodCbs = document.querySelectorAll('.period-cb');
          const checkedPeriods = [];
          periodCbs.forEach(cb => { if(cb.checked) checkedPeriods.push(cb.value) });

          originalModalData = {
            date: document.getElementById('absDate').value,
            duration: document.getElementById('absDuration').value,
            reason: document.getElementById('absReason').value,
            urgency: document.getElementById('urgencyValue').value,
            specialInst: document.getElementById('specialInst').value,
            subPlanUrl: document.getElementById('subPlanUrlInput').value,
            periods: checkedPeriods.join(',')
          };
        } else {
          originalModalData = {};
        }
      }

      function hasUnsavedData() {
        const isRequestModalOpen = !document.querySelector('#modal').classList.contains('opacity-0');

        const isStaffModalOpen = !document.getElementById('staffModal').classList.contains('opacity-0');

        if (isStaffModalOpen) {
          const currentName = document.getElementById('staffNameInput').value;
          const currentEmail = document.getElementById('staffEmailInput').value;
          const currentDuty = document.getElementById('staffDutyInput').value;
          if (originalModalData.name === undefined && (currentName.trim() !== "" || currentEmail.trim() !== "" || currentDuty.trim() !== "")) return true;
          if (originalModalData.name !== undefined && (currentName !== originalModalData.name || currentEmail !== originalModalData.email || currentDuty !== originalModalData.duty)) return true;
        }


        if (isRequestModalOpen) {
          const periodCbs = document.querySelectorAll('.period-cb');
          const checkedPeriods = [];
          periodCbs.forEach(cb => { if(cb.checked) checkedPeriods.push(cb.value) });

          const currentDate = document.getElementById('absDate').value;
          const currentDuration = document.getElementById('absDuration').value;
          const currentReason = document.getElementById('absReason').value;
          const currentUrgency = document.getElementById('urgencyValue').value;
          const currentSpecialInst = document.getElementById('specialInst').value;
          const currentSubPlanUrl = document.getElementById('subPlanUrlInput').value;
          const currentPeriods = checkedPeriods.join(',');

          const isEdit = document.getElementById('editAbsenceId').value !== "";

          if (!isEdit) {
            // Adding new: if they typed *anything* that isn't default
            if (currentDate || currentSpecialInst.trim() !== "" || currentSubPlanUrl.trim() !== "" || checkedPeriods.length > 0) return true;
          } else {
            // Editing existing: compare to original state
            if (originalModalData.date !== undefined && (
                currentDate !== originalModalData.date ||
                currentDuration !== originalModalData.duration ||
                currentReason !== originalModalData.reason ||
                currentUrgency !== originalModalData.urgency ||
                currentSpecialInst !== originalModalData.specialInst ||
                currentSubPlanUrl !== originalModalData.subPlanUrl ||
                currentPeriods !== originalModalData.periods)) {
                return true;
            }
          }
        }

        return false;
      }

      function attemptCloseAllModals() {
        if (hasUnsavedData()) {

          showConfirm("You have unsaved changes. Are you sure you want to close this modal and discard them?", () => {
             originalModalData = {};
             closeAllModals();
          });
          return;
        }

        // Reset the captured state
        originalModalData = {};
        closeAllModals();
      }


      document.addEventListener('keydown', function(event) {
        if (event.key === "Escape") {
          const modals = document.querySelectorAll('.modal');
          let anyOpen = false;
          modals.forEach(m => {
            if (!m.classList.contains('opacity-0') && m.id !== 'genericModalOverlay') {
              anyOpen = true;
            }
          });

          if (anyOpen) {
            attemptCloseAllModals();
          }
        }
      });
      // --- END MODAL CLOSE AND UNSAVED DATA LOGIC ---

      function closeAllModals() {
        const modals = document.querySelectorAll('.modal');
        modals.forEach(m => {
          m.classList.add('opacity-0');
          m.classList.add('pointer-events-none');
        });
        document.querySelector('body').classList.remove('overflow-hidden');
      }

      function showToast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');

        let bgColor, icon;
        if (type === 'success') {
          bgColor = 'bg-[#00843D]';
          icon = '✅';
        } else if (type === 'error') {
          bgColor = 'bg-red-600';
          icon = '❌';
        } else if (type === 'warning') {
          bgColor = 'bg-yellow-500';
          icon = '⚠️';
        } else {
          bgColor = 'bg-gray-800';
          icon = 'ℹ️';
        }

        toast.className = `${bgColor} text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 transform transition-all duration-300 translate-y-[-100%] opacity-0 pointer-events-auto`;

        toast.innerHTML = `
          <span class="text-lg">${icon}</span>
          <span class="font-medium text-sm max-w-xs break-words">${escapeHtml(message)}</span>
          <button class="ml-auto text-white hover:text-gray-200" onclick="this.parentElement.remove()">
             <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20"><path d="M10 8.586l4.95-4.95 1.414 1.414L11.414 10l4.95 4.95-1.414 1.414L10 11.414l-4.95 4.95-1.414-1.414L8.586 10 3.636 5.05l1.414-1.414L10 8.586z"></path></svg>
          </button>
        `;

        container.appendChild(toast);

        // Animate in
        requestAnimationFrame(() => {
          toast.classList.remove('translate-y-[-100%]', 'opacity-0');
        });

        // Auto remove
        setTimeout(() => {
          toast.classList.add('translate-y-[-100%]', 'opacity-0');
          setTimeout(() => {
            if (toast.parentElement) toast.remove();
          }, 300);
        }, 5000);
      }
      let currentConfirmCallback = null;
      //  // Stash existing state if we open over another modal
      function showConfirm(message, callback) {
        document.getElementById('confirmModalMessage').innerText = message;
        currentConfirmCallback = callback;

        const modal = document.getElementById('customConfirmModal');
        modal.classList.remove('opacity-0', 'pointer-events-none');

        document.getElementById('confirmModalActionBtn').onclick = () => {
           const cb = currentConfirmCallback;
           closeCustomConfirm();
           if (cb) cb();
        };
      }

      function closeCustomConfirm() {
        const modal = document.getElementById('customConfirmModal');
        modal.classList.add('opacity-0', 'pointer-events-none');
        currentConfirmCallback = null;
      }

      function showDuplicateWarning(existingIndex) {
        const modal = document.getElementById('duplicateAbsenceModal');
        modal.classList.remove('opacity-0', 'pointer-events-none');
        document.getElementById('duplicateModalEditBtn').onclick = () => {
          closeDuplicateWarning();
          toggleModal(); // Close the current creation form first
          setTimeout(() => {
            editAbsence(existingIndex);
          }, 100); // Give it a slight delay to allow the modal state to reset
        };
      }

      function closeDuplicateWarning() {
        const modal = document.getElementById('duplicateAbsenceModal');
        modal.classList.add('opacity-0', 'pointer-events-none');
      }

      function cancelDuplicateWarning() {
        closeDuplicateWarning();
        toggleModal(); // Close the new request form
      }

      // Override attemptCloseAllModals to use showConfirm
      let oldAttemptCloseAllModals = "";
      try {
        oldAttemptCloseAllModals = attemptCloseAllModals.toString();

        // Let's actually override it properly
        window.attemptCloseAllModals = function() {
          if (hasUnsavedData()) {
            showConfirm("You have unsaved changes. Are you sure you want to close this modal and discard them?", () => {
               originalModalData = {};
               closeAllModals();
            });
            return;
          }

          // Reset the captured state
          originalModalData = {};
          closeAllModals();
        };
      } catch(e) {
        console.warn("Error overriding attemptCloseAllModals: ", e);
      }

</script>
